name: RotLab TV (Windows build + screenshot test)
on:
  push:
    branches: [main]
    paths: ["shell/**", ".github/workflows/shell.yml", "app/tv.html", "app/hub.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "shell/src-tauri -> target"
      - name: Build RotLabTV.exe
        id: build
        shell: bash
        run: |
          mkdir -p out
          cd shell/src-tauri
          cargo build --release 2>&1 | tee ../../out/build.log
          test ${PIPESTATUS[0]} -eq 0
          cp target/release/rotlab-tv.exe ../../out/RotLabTV.exe
      - uses: actions/setup-python@v5
        if: steps.build.outcome == 'success'
        with:
          python-version: "3.12"
      - name: Run it on Windows and take screenshots
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: ./shell/ci-test.ps1
      - name: Publish results to the ci-results branch
        if: always()
        shell: bash
        run: |
          cd out
          echo "${{ github.sha }} build=${{ steps.build.outcome }} $(date -u)" > status.txt
          rm -f RotLabTV.exe.keep
          git init -q -b ci-results
          git config user.name "rotlab-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A -- . ':!RotLabTV.exe'
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
      - name: Release RotLabTV.exe
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^version' shell/src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="shell-v$VER"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "RotLab TV $VER" --notes "The RotLab TV window. RotLab downloads this by itself."
          gh release upload "$TAG" out/RotLabTV.exe --clobber

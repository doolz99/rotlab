<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RotLab</title>
<style>
:root{color-scheme:dark;--face:#2b2b2b;--hi:#6a6a6a;--lt:#454545;--sh:#1a1a1a;--dk:#000;--field:#121212;--text:#e8e8e8;--dim:#a8a8a8;--sel:#0a246a;--sel2:#3a6ea5;--note:#e8d27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0b;color:var(--text);font:13px/1.4 Tahoma,Verdana,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.out{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.in{background:var(--field);box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.btn{background:var(--face);border:0;padding:3px 12px;min-height:25px;cursor:pointer;white-space:nowrap;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:4px 11px 2px 13px}
.btn:disabled{color:#6b6b6b;cursor:default}
.btn.sm{min-height:21px;padding:1px 8px;font-size:12px}
.btn.b{font-weight:bold}
.btn:focus-visible,.tab:focus-visible,.proj:focus-visible{outline:1px dotted #ddd;outline-offset:-5px}
.field{background:var(--field);border:0;padding:4px 6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.field:focus{outline:1px dotted #888;outline-offset:-4px}
select.field{padding:3px 4px}
.dim{color:var(--dim)}
a,.lnk{color:#9db8ff;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.win{position:fixed;inset:0;display:flex;flex-direction:column;padding:3px}
.titlebar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;background:linear-gradient(90deg,var(--sel),var(--sel2));color:#fff;font-weight:bold;user-select:none}
.titlebar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menubar{display:flex;gap:1px;padding:2px;border-bottom:1px solid var(--dk);box-shadow:0 1px 0 var(--lt);position:relative;z-index:20}
.mi{position:relative}
.mi > button{background:none;border:0;padding:2px 9px;cursor:pointer}
.mi > button u{text-decoration:underline}
.mi.open > button{background:var(--sel);color:#fff}
.drop{position:absolute;top:100%;left:0;min-width:240px;padding:3px;display:none;z-index:30}
.mi.open .drop{display:block}
.drop button{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:4px 20px;cursor:pointer}
.drop button:hover,.drop button:focus{background:var(--sel);color:#fff;outline:none}
.drop hr{border:0;border-top:1px solid var(--dk);border-bottom:1px solid var(--lt);margin:3px 2px}
.banner{margin:6px 6px 0;padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:#3a1d1d;box-shadow:inset 0 0 0 1px #7a2c2c}
.banner.info{background:#1b2333;box-shadow:inset 0 0 0 1px #34507e}
.banner.ok{background:#1d2a1d;box-shadow:inset 0 0 0 1px #2f5a3a}
.main{flex:1;min-height:0;display:flex;gap:6px;padding:6px}
.left{width:190px;flex:none;display:flex;flex-direction:column;min-height:0;padding:4px}
.plist{flex:1;overflow:auto;padding:2px}
.proj{display:flex;gap:7px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:5px 7px;cursor:pointer}
.proj.on{background:var(--sel);color:#fff}
.proj.drag{outline:2px dashed #9db8ff;outline-offset:-3px}
.proj .ic{width:16px;flex:none;text-align:center;font-size:12px;color:#9a9a9a}
.proj.on .ic{color:#cfd8ff}
.proj .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newdot{width:8px;height:8px;background:var(--note);border:1px solid #000;flex:none}
.center{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.foryou{padding:5px 8px;display:flex;flex-direction:column;gap:3px}
.fy{display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:2px 4px;cursor:pointer;width:100%}
.fy:hover{background:#1b2333}
.fy .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--note);min-width:68px}
.tabs{display:flex;gap:2px;padding-left:4px;align-items:flex-end}
.tab{background:var(--face);border:0;padding:3px 14px;cursor:pointer;margin-bottom:-3px;position:relative;box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset 2px 2px var(--lt)}
.tab.on{padding-top:5px;margin-top:-2px;z-index:2;font-weight:bold}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h2{font-size:15px;margin:0}
.scroll{flex:1;min-height:0;overflow:auto}
.cats{width:132px;flex:none;padding:4px;overflow:auto}
.cat{display:flex;justify-content:space-between;padding:3px 6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.cat.on{background:var(--sel);color:#fff}
.cat .n{color:var(--dim)}.cat.on .n{color:#cfd8ff}
.sep{height:1px;background:var(--dk);box-shadow:0 1px 0 var(--lt);margin:6px 2px}
.list{flex:1;min-height:110px;overflow:auto;padding:2px}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;z-index:2;text-align:left;font-weight:normal;padding:3px 8px;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi);white-space:nowrap}
td{padding:2px 8px;white-space:nowrap;vertical-align:middle}
tr.row{cursor:default}
tr.row.sel td{background:var(--sel);color:#fff}
tr.row.sel td .dim{color:#cfd8ff}
tr.grp td{color:var(--dim);padding-top:7px;font-size:12px}
td.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.thumb{width:54px;height:30px;background:#1e2430;border:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7d8aa3;font-size:10px}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{display:inline-block;padding:0 5px;border:1px solid #5a5a5a;color:#d6d6d6;font-size:11px;margin-right:3px}
.tag.lk{border-color:#34507e;color:#9db8ff}
.bub{color:var(--note);font-size:12px}
.detail{display:flex;gap:10px;flex-wrap:wrap;height:52%;min-height:220px;overflow:auto;padding:8px}
.stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center;flex:1 1 380px;min-width:260px;min-height:200px;max-height:100%}
.stage video,.stage img{max-width:100%;max-height:100%;display:block}
.stage img{cursor:crosshair}
.stage audio{width:94%}
.dside{flex:1 1 300px;min-width:260px;display:flex;flex-direction:column;gap:6px;min-height:0}
.cmts{flex:1;min-height:60px;overflow:auto;padding:4px 8px}
.cmt{padding:3px 0;border-bottom:1px solid #222;display:flex;gap:8px;align-items:baseline}
.cmt.res{opacity:.5}
.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--note);color:#000;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #000;cursor:pointer}
.marks{position:relative;height:10px;background:#151515;border:1px solid #000}
.mark{position:absolute;top:0;width:4px;height:8px;background:var(--note);margin-left:-2px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:0;padding:1px 8px;cursor:pointer;font-size:12px;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi)}
.chip.on{background:var(--sel);color:#fff;box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi)}
.right{width:300px;flex:none;padding:5px;display:flex;flex-direction:column;gap:5px;min-height:0}
.people{padding:5px 8px;display:flex;flex-direction:column;gap:2px}
.dot{width:9px;height:9px;border:1px solid #000;display:inline-block;flex:none;background:#555}
.dot.editing{background:#b48cff}.dot.hub,.dot.online{background:#3fbf6a}
.feed{flex:1;min-height:0;overflow:auto;padding:6px 8px;line-height:1.5}
.feed .day{color:var(--dim);font-size:12px;margin-top:6px}
.feed .t{color:var(--dim);margin-right:6px;font-size:12px}
.feed .msg{padding:2px 3px}
.feed .act{padding:0 3px;color:#8f8f8f;font-size:12px}
.feed .act b{color:#b8b8b8;font-weight:normal}
.feed .act a{color:#8fa6dd}
.feed .new{background:#1d1b12}
.feed .q{color:#d8cfa6;padding-left:20px}
.feed .sub{padding-left:20px}
.newdiv{display:flex;align-items:center;gap:6px;margin:6px 0 3px;color:var(--note);font-size:12px}
.newdiv:before,.newdiv:after{content:"";flex:1;height:1px;background:#8a7a3a}
.status{display:flex;gap:3px;padding:2px}
.status > div{padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* outline */
.seg{display:grid;grid-template-columns:34px 1fr 170px;gap:12px;padding:10px 12px;border-bottom:1px solid #222}
.num{font-family:"Courier New",Courier,monospace;font-size:19px;color:#7a7a7a;text-align:right}
.steps{display:flex;margin-top:7px}
.step{flex:1;border:0;font-size:12px;padding:4px 6px;cursor:pointer;color:#bdbdbd;background:#1c1c1c;box-shadow:inset 1px 1px #3a3a3a,inset -1px -1px #000;text-align:left}
.step.past{background:#1d2b22;color:#9fd4b0}
.step.cur{background:var(--sel);color:#fff;font-weight:bold;box-shadow:inset 1px 1px var(--sel2),inset -1px -1px #000}
.badge{font-size:10.5px;padding:0 5px;border:1px solid #000;white-space:nowrap}
fieldset{border:2px groove #4a4a4a;margin:0;padding:7px 10px 9px;min-width:0}
legend{padding:0 4px}
/* board */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px;flex:1;min-height:0;overflow:auto}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.colh{display:flex;justify-content:space-between;padding:2px 4px;font-weight:bold}
.tk{background:#1c1c1c;border:1px solid #000;box-shadow:inset 1px 1px #3c3c3c;padding:6px 8px 7px;display:flex;flex-direction:column;gap:3px;position:relative;cursor:pointer;text-align:left;width:100%;border-top-width:3px}
.tk:hover{background:#222}
.tk .ty{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.tk .m{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.tk .m .hot{color:var(--note)}
.tk .nd{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--note);border:1px solid #000}
.tk.done{opacity:.6}
.post{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #222}
.av{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold;border:1px solid #000;font-size:12px}
.take{background:#1c1c1c;border:1px solid #000;box-shadow:inset 1px 1px #3c3c3c;padding:6px 8px;margin-top:5px;display:flex;flex-direction:column;gap:4px}
/* dialogs */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modalbg.show{display:flex}
.dlg{width:min(600px,94vw);max-height:92vh;display:flex;flex-direction:column;padding:3px}
.dlg.wide{width:min(820px,96vw)}
.dlg .body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .btns .btn{min-width:84px}
label.ck{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.bar{height:16px;padding:2px;display:flex}
.bar i{display:block;height:100%;background:var(--sel2)}
.dropzone{position:fixed;inset:10px;border:3px dashed #9db8ff;background:rgba(10,36,106,.35);display:none;align-items:center;justify-content:center;font-size:22px;z-index:60;pointer-events:none}
.dropzone.show{display:flex}
.toast{position:fixed;right:14px;bottom:34px;padding:8px 12px;display:none;z-index:70;max-width:380px}
.empty{padding:18px;color:var(--dim)}
.rcur{position:fixed;z-index:40;pointer-events:none;transition:left .09s linear,top .09s linear}
.rcur span{position:absolute;left:12px;top:15px;background:#b48cff;color:#000;font-size:11px;padding:0 4px;border:1px solid #000;white-space:nowrap}
#typing{font-size:12px;color:var(--dim);min-height:16px;padding:0 4px;font-style:italic}
@media (max-width:1100px){.right{width:250px}.left{width:165px}}
</style></head>
<body>
<div class="win out">
 <div class="titlebar">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="10" fill="#c0c0c0" stroke="#000"/><rect x="1" y="2" width="14" height="3" fill="#fff" stroke="#000"/><path d="M6 8 L11 10 L6 12 Z" fill="#000"/></svg>
  <span id="title">RotLab</span>
 </div>
 <div class="menubar">
  <div class="mi"><button><u>F</u>ile</button><div class="drop out">
   <button data-act="newproj">New project...</button>
   <button data-act="add">Add files...<span class="dim">Ctrl+O</span></button><hr>
   <button data-act="openproj">Open project folder</button>
   <button data-act="openinbox">Open Inbox folder</button>
   <button data-act="sortinbox">Sort Inbox now</button><hr>
   <button data-act="settings">Settings...</button><hr>
   <button data-act="quit">Quit RotLab</button></div></div>
  <div class="mi"><button><u>P</u>roject</button><div class="drop out">
   <button data-act="projset">Rename / change type...</button>
   <button data-act="links">Linked files...</button>
   <button data-act="newpart">Add an outline part</button>
   <button data-act="newreq">New request...</button><hr>
   <button data-act="archive">Archive this project</button></div></div>
  <div class="mi"><button><u>V</u>iew</button><div class="drop out">
   <button data-act="v-files">Files</button><button data-act="v-board">Board</button><button data-act="v-outline">Outline</button><hr>
   <button data-act="msgonly">Only messages in the feed</button><hr>
   <button data-act="reload">Refresh</button></div></div>
  <div class="mi"><button><u>S</u>ync</button><div class="drop out"><button data-act="sync">Sync status &amp; linking...</button></div></div>
  <div class="mi"><button>P<u>h</u>one</button><div class="drop out"><button data-act="phone">Upload from phone...</button></div></div>
  <div class="mi"><button><u>H</u>elp</button><div class="drop out"><button data-act="about">About RotLab</button></div></div>
 </div>
 <div id="banners"></div>
 <div class="main">
  <div class="left out">
   <div class="dim" style="font-size:11.5px;padding:2px 6px 4px">Projects</div>
   <div class="plist in" id="plist"></div>
   <div style="padding:6px 2px 2px"><button class="btn sm" data-act="newproj" style="width:100%">+ New project</button></div>
  </div>
  <div class="center">
   <div class="foryou out" id="foryou"></div>
   <div class="tabs" id="tabs"></div>
   <div class="pane out" id="view"></div>
  </div>
  <div class="right out">
   <div class="people in" id="people"></div>
   <div class="feed in" id="feed"></div>
   <div id="typing" aria-live="polite"></div>
   <div style="display:flex;gap:6px"><label for="say" class="dim" style="align-self:center">Say:</label><input id="say" class="field" style="flex:1;min-width:0"><button class="btn" id="sendBtn">Send</button></div>
  </div>
 </div>
 <div class="status">
  <div class="in" id="stSync" style="flex:1">Sync: starting...</div>
  <div class="in" id="stLive" title="Instant chat and cursors">Live: off</div>
  <div class="in" id="stVer">v-</div>
 </div>
</div>
<input type="file" id="filePick" multiple style="display:none">
<input type="file" id="takePick" multiple style="display:none">
<div class="dropzone" id="dropzone">Drop files to add them</div>
<div class="toast out" id="toast"></div>
<div id="cursors"></div>
<div class="modalbg" id="modal"><div class="dlg out" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
 <div class="titlebar"><span id="dlgTitle">Dialog</span><button class="btn sm" id="dlgX" aria-label="Close" style="min-height:18px;padding:0 6px">×</button></div>
 <div class="body" id="dlgBody"></div>
</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size=b=>b>=1e9?(b/1e9).toFixed(2)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.ceil(b/1e3))+" KB";
const dur=s=>{if(!isFinite(s)||s==null)return"";s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const tm=ts=>new Date(ts*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayName=ts=>{const d=new Date(ts*1000),t=new Date(),y=new Date(Date.now()-864e5);if(d.toDateString()===t.toDateString())return"Today";if(d.toDateString()===y.toDateString())return"Yesterday";return d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})};
const ago=ts=>{const d=Date.now()/1000-ts;if(d<90)return"just now";if(d<3600)return Math.round(d/60)+" min ago";if(d<86400)return Math.round(d/3600)+" h ago";return Math.round(d/86400)+" days ago"};
const ymd=ts=>{const d=new Date(ts*1000);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const short=p=>String(p||"").split("/").pop();
const isImg=p=>/\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(p);
const TAGS=["B-roll","Interview","Music","SFX","Best","Don't use"];
const TYPE_COLOR={"Sound effect":"#e8d27a","Music":"#6aa9ff","Footage":"#3fbf6a","Graphic":"#e08a3a","Edit":"#ff7a9a","Writing":"#b48cff","Idea":"#9adbd8","Other":"#bdbdbd"};
const TYPE_ICON={video:"▶",music:"♫",art:"✎","3d":"◆",other:"■"};
async function api(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3800)}
const LS={get(k,d){try{const v=localStorage.getItem("rl_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("rl_"+k,JSON.stringify(v))}catch(e){}}};

let S=null,W=null,pid=null,area=LS.get("area","files"),partSel=null,cat="Video",q="",lib=null,libKey="",libGen=-1,selPath=null,focused=document.hasFocus(),uiHash=null;
let readAt=null,durCache={},openGroups=new Set(),boardFor="all",msgOnly=LS.get("msgonly",false),seen=LS.get("seen",{});
window.addEventListener("focus",()=>{focused=true;tick()});window.addEventListener("blur",()=>focused=false);
function who(u){return u===S.me?"You":u}
const proj=()=>W.projects.find(p=>p.pid===pid);
const isShared=()=>pid===S.shared;
const pname=id=>id===S.shared?"Shared":(W.projects.find(p=>p.pid===id)||{}).name||"?";
const pfolder=id=>id===S.shared?"Shared":(W.projects.find(p=>p.pid===id)||{}).folder||"";
const partsOf=()=>W.parts.filter(p=>p.pid===pid);
const hasOutline=()=>!isShared()&&partsOf().length>0;

/* ---------------- menus ---------------- */
document.querySelectorAll(".mi > button").forEach(b=>{b.addEventListener("click",e=>{const mi=b.parentElement,was=mi.classList.contains("open");closeMenus();if(!was)mi.classList.add("open");e.stopPropagation()});
 b.addEventListener("mouseenter",()=>{if(document.querySelector(".mi.open")&&!b.parentElement.classList.contains("open")){closeMenus();b.parentElement.classList.add("open")}})});
function closeMenus(){document.querySelectorAll(".mi.open").forEach(m=>m.classList.remove("open"))}
document.addEventListener("click",closeMenus);
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b){closeMenus();act(b.dataset.act,b)}});
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key.toLowerCase()==="o"){e.preventDefault();act("add")}if(e.key==="Escape"){closeMenus();if(dlgOpen()&&!dlgLocked)closeDlg()}});
async function act(a){try{
 if(a==="add")$("filePick").click();
 else if(a==="newproj")newProjDlg();
 else if(a==="openproj")await api("/api/reveal",{path:pfolder(pid)});
 else if(a==="openinbox")await api("/api/reveal",{path:"Inbox"});

/* ---------------- for you ---------------- */
function needsMe(r){if(["done","cancelled"].includes(r.status))return false;if(r.status==="review")return r.by===S.me;if(r.status==="open")return r.by!==S.me&&(r.to==="anyone"||r.to===S.me);return false}
function forYou(){const it=[];
 for(const r of W.requests){if(r.status==="review"&&r.by===S.me)it.push({k:"to check",t:`${who(r.claimed||"?")} sent files for #${r.num} ${r.title}`,go:()=>ticketDlg(r.rid),pid:r.pid,ts:r.last});
  else if(r.status==="open"&&r.by!==S.me&&(r.to===S.me||(r.to==="anyone"&&Date.now()/1000-r.ts<7*86400)))it.push({k:r.to===S.me?"asked you":"request",t:`#${r.num} ${r.title} (${r.type})`,go:()=>ticketDlg(r.rid),pid:r.pid,ts:r.ts})}
 const byFile={};for(const c of W.comments)if(!c.resolved&&c.user!==S.me&&c.ts>(LS.get("fseen",{})[c.file]||0))(byFile[c.file]=byFile[c.file]||[]).push(c);
 for(const [f,cs] of Object.entries(byFile))it.push({k:"comments",t:`${cs.length} new comment${cs.length>1?"s":""} on ${short(f)}`,go:()=>gotoFile(f),pid:projOfPath(f),ts:Math.max(...cs.map(c=>c.ts))});
 for(const l of W.links){if(l.waiting)it.push({k:"waiting",t:`New ${short(l.newest)} from ${pname(l.src)} goes into ${pname(l.pid)} when it's closed`,go:()=>{selectProject(l.pid);linksDlg()},pid:l.pid,ts:0});
  else if(l.pinned&&l.update)it.push({k:"new version",t:`${pname(l.src)} has a newer ${short(l.newest)} (you kept an older one)`,go:()=>{selectProject(l.pid);linkVersionsDlg(l.lid)},pid:l.pid,ts:0})}
 const ack=LS.get("expack",{});
 const cack=LS.get("colack",{});for(const e of S.log)if(e.type==="collected"&&e.user===S.me&&!cack[e.id]&&Date.now()/1000-e.ts<3*86400)it.push({k:"copied in",t:`${short(e.file)} used ${e.count} outside file${e.count>1?"s":""}: copied to ${e.folder}. Next time VEGAS/FL asks where it is, point it there.`,go:()=>{cack[e.id]=1;LS.set("colack",cack);gotoFile(e.file)},pid:projOfPath(e.file),ts:e.ts});

async function makePreview(it){const src="/media?path="+encodeURIComponent(it.path);
 const cv=document.createElement("canvas"),cx=cv.getContext("2d");const out={path:it.path,size:it.size,kind:it.media};

  const[w,h]=fit(im.naturalWidth,im.naturalHeight,480,360);cv.width=w;cv.height=h;cx.fillStyle="#222";cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);out.w=im.naturalWidth;out.h=im.naturalHeight}
 else if(it.media==="Video"){const v=document.createElement("video");v.muted=true;v.preload="auto";v.src=src;
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;setTimeout(()=>rej(new Error("timeout")),20000)});
  const d=v.duration||0,[fw,fh]=fit(v.videoWidth||16,v.videoHeight||9,240,135);cv.width=fw*4;cv.height=fh;out.duration=d;out.w=v.videoWidth;out.h=v.videoHeight;
  for(let k=0;k<4;k++){v.currentTime=Math.min(d*(0.1+k*0.25),Math.max(0,d-0.1));await new Promise((res,rej)=>{v.onseeked=res;setTimeout(res,6000)});cx.drawImage(v,k*fw,0,fw,fh)}
  v.removeAttribute("src");v.load()}
 else if(it.media==="Audio"){if(it.size>200e6)throw new Error("too big");const buf=await (await fetch(src)).arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)();
  const ab=await ac.decodeAudioData(buf);ac.close&&ac.close();out.duration=ab.duration;const W=640,H=90,ch=ab.getChannelData(0),step=Math.max(1,Math.floor(ch.length/W));
  cv.width=W;cv.height=H;cx.fillStyle="#141a24";cx.fillRect(0,0,W,H);cx.fillStyle="#6aa9ff";
  for(let x=0;x<W;x++){let mx=0;for(let i=x*step,e=Math.min(ch.length,i+step);i<e;i+=4){const a=Math.abs(ch[i]);if(a>mx)mx=a}const bh=Math.max(1,mx*H*0.95);cx.fillRect(x,(H-bh)/2,1,bh)}}
 out.data=cv.toDataURL("image/jpeg",0.72);return out}

 giphy:{name:"GIPHY",url:"https://developers.giphy.com/dashboard/",how:"Make a free account at developers.giphy.com, click Create an App, choose API, give it any name, and copy the API key it shows."}};
const onSvc=k=>k.startsWith("pb_")?"pixabay":k==="giphy"?"giphy":null;
function onlineShell(){const ph=["hdris","textures","models"].includes(ON.kind);
 $("view").innerHTML=`<div class="head"><h2>Find online</h2><span class="dim">free sounds, images and 3D assets · downloads go into <b>${esc(pname(pid))}</b></span></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select id="onKind" class="field" aria-label="What to search for">${ON_KINDS.map(([k,l])=>`<option value="${k}" ${k===ON.kind?"selected":""}>${l}</option>`).join("")}</select>
  <input id="onQ" class="field" style="flex:1;min-width:160px" placeholder="${ph?"e.g. brick, sunset, chair":({pb_video:"e.g. city timelapse, ocean",pb_clipart:"e.g. arrow, explosion, cartoon cat",pb_photo:"e.g. skate park",giphy:"e.g. shocked, mind blown",images:"e.g. skate park, old tv"})[ON.kind]||"e.g. whoosh, rain, crowd cheer"}" value="${esc(ON.q)}" aria-label="Search">
  ${ph?`<select id="onRes" class="field" aria-label="Quality"><option value="">Normal quality</option><option value="1k" ${ON.res==="1k"?"selected":""}>1k (small)</option><option value="2k" ${ON.res==="2k"?"selected":""}>2k</option><option value="4k" ${ON.res==="4k"?"selected":""}>4k (big)</option></select>`
   :["audio","images"].includes(ON.kind)?`<select id="onLic" class="field" aria-label="Licence"><option value="any">Any free licence</option><option value="commercial" ${ON.lic==="commercial"?"selected":""}>OK for monetised videos</option><option value="free" ${ON.lic==="free"?"selected":""}>No credit needed</option></select>`
   :ON.kind==="giphy"?`<select id="onGif" class="field" aria-label="Download as"><option value="mp4">Download as MP4 (best for VEGAS)</option><option value="gif" ${ON.gif==="gif"?"selected":""}>Download as GIF</option></select>`:""}
  <button class="btn b" id="onGo">Search</button></div>
 <div class="in scroll" id="onRes_" style="padding:6px"></div>
 <div class="dim" style="font-size:11.5px"><span id="onKeyLine"></span> ${ON.kind==="giphy"?'<b>Powered by GIPHY.</b> Most GIFs are clips of films, shows and memes owned by someone else: fine for fun and private edits, risky in monetised or public videos.':ON.kind.startsWith("pb_")?'From <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a>: free to use, also commercially, no credit needed (credit is still saved).':ph?'3D assets: Poly Haven, CC0 (free for anything). Powered by <a href="https://polyhaven.com" target="_blank" rel="noopener">Poly Haven</a>.':'From <a href="https://openverse.org" target="_blank" rel="noopener">Openverse</a> (Creative Commons). Always check the licence on the item\'s page; RotLab keeps the credit with every download.'}</div>`;$("view")._h="";
 const go=()=>{ON.q=$("onQ").value.trim();ON.page=1;ON.items=[];onlineSearch()};
 $("onGo").onclick=go;$("onQ").onkeydown=e=>{if(e.key==="Enter")go()};
 $("onKind").onchange=()=>{ON.kind=$("onKind").value;LS.set("on_kind",ON.kind);ON.items=[];ON.err="";onlineShell();if(ON.q)go()};
 if($("onLic"))$("onLic").onchange=()=>{ON.lic=$("onLic").value;LS.set("on_lic",ON.lic);if(ON.q)go()};
 if($("onRes"))$("onRes").onchange=()=>{ON.res=$("onRes").value};if($("onGif"))$("onGif").onchange=()=>{ON.gif=$("onGif").value};
 const svc=onSvc(ON.kind);if(svc)$("onKeyLine").innerHTML=S.online_keys&&S.online_keys[svc]?`Using your ${ON_KEYS[svc].name} key · <a id="onChKey">Change key</a>`:"";if($("onChKey"))$("onChKey").onclick=()=>{ON.needKey=svc;renderOnline()};if(svc&&S.online_keys&&!S.online_keys[svc])ON.needKey=svc;
 renderOnline();$("onQ").focus()}
async function onlineSearch(){if(!ON.q&&!["hdris","textures","models"].includes(ON.kind)){ON.err="Type what you're looking for.";return renderOnline()}
 ON.busy=true;ON.err="";renderOnline();
 try{const r=await api("/api/online/search",{kind:ON.kind,q:ON.q,page:ON.page,lic:ON.lic});ON.needKey=r.need_key||null;ON.items=ON.page===1?r.items:ON.items.concat(r.items);ON.more=r.more;ON.total=r.total}catch(e){ON.err=e.message}
 ON.busy=false;renderOnline()}
function onlineCard(it,i){const jid=ON.added[it.source+it.id],job=jid&&(S.downloads||[]).find(d=>d.id===jid);
 const lc=it.plain.commercial&&it.plain.edit?(it.plain.credit?"#e8d27a":"#9fe0b0"):"#ffb27a";
 const media=it.kind==="video"?`<div style="height:120px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden"><video src="${esc(it.preview)}" poster="${esc(it.thumb)}" preload="none" muted loop playsinline style="max-width:100%;max-height:120px" onmouseenter="this.play().catch(()=>{})" onmouseleave="this.pause()"></video></div>`:it.kind==="audio"?`<div class="thumb" style="width:100%;height:auto;padding:6px;display:block"><audio controls preload="none" src="${esc(it.preview)}" style="width:100%;height:30px"></audio></div>`
  :`<div style="height:120px;background:#0e1118;display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="${esc(it.thumb)}" alt="" loading="lazy" style="max-width:100%;max-height:120px" onerror="this.style.display='none'"></div>`;
 let btn;if(job&&job.state==="downloading")btn=`<span class="dim" style="font-size:12px">Downloading${job.total?" "+Math.floor(job.got/job.total*100)+"%":"..."}</span>`;
 else if(job&&job.state==="done")btn=`<a data-go="${esc(job.file)}">Added ✓ show</a>`;else if(job&&job.state==="error")btn=`<span style="color:#ffb4b4;font-size:12px">${esc(job.error)}</span> <button class="btn sm" data-add="${i}">Retry</button>`;
 else btn=`<button class="btn sm b" data-add="${i}">Add</button>`;
 return `<div class="tk" style="cursor:default;border-top-color:${lc};gap:5px">${media}<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.title)}">${esc(it.title)}</b>
  <span class="dim" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.creator?"by "+esc(it.creator)+" · ":""}${esc(it.provider)}${it.duration?" · "+dur(it.duration):""}</span>
  <span style="font-size:11.5px;color:${lc}">${esc(it.plain.label)}</span>
  <span style="display:flex;gap:8px;align-items:center;justify-content:space-between">${btn}${it.page?`<a href="${esc(it.page)}" target="_blank" rel="noopener" style="font-size:12px">page</a>`:""}</span></div>`}
function keyBox(svc){const k=ON_KEYS[svc];return `<div class="empty" style="color:var(--text);max-width:560px"><b>${k.name} needs a free key (once).</b><br><span class="dim">${esc(k.how)} The key is saved in the shared folder, so it works on both PCs.</span>
 <div style="display:flex;gap:6px;margin-top:8px"><a href="${k.url}" target="_blank" rel="noopener" class="btn sm" style="text-decoration:none;color:var(--text);display:inline-flex;align-items:center">Open ${k.name}</a><input id="onKeyIn" class="field" style="flex:1" placeholder="paste the key here" aria-label="${k.name} key"><button class="btn sm b" id="onKeySave" data-svc="${svc}">Save</button></div></div>`}
function renderOnline(){const box=$("onRes_");if(!box)return;let h="";
 if(ON.needKey&&onSvc(ON.kind)===ON.needKey)h=keyBox(ON.needKey);
 else if(ON.err)h=`<div class="empty" style="color:#ffb4b4">${esc(ON.err)}</div>`;
 else if(!ON.items.length&&ON.busy)h='<div class="empty">Searching...</div>';
 else if(!ON.items.length)h=`<div class="empty">${ON.q?"Nothing found. Try other words.":"Search for free "+({audio:"sound effects and music",images:"photos and pictures",pb_video:"stock video clips",pb_clipart:"clipart and illustrations",pb_photo:"stock photos",giphy:"GIFs",hdris:"HDRI skies for lighting in Blender",textures:"textures (wood, brick, ground...)",models:"3D models"})[ON.kind]+". Leave it empty for 3D to see the most popular."}</div>`;
 else h=`<div class="dim" style="font-size:12px;margin-bottom:6px">${ON.total} found</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">${ON.items.map(onlineCard).join("")}</div>${ON.more?`<div style="padding:8px 0"><button class="btn" id="onMore" ${ON.busy?"disabled":""}>${ON.busy?"Loading...":"More"}</button></div>`:""}`;
 if(box._h===h)return;const st=box.scrollTop;box.innerHTML=h;box._h=h;box.scrollTop=st;
 box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>onlineAdd(ON.items[+b.dataset.add]));
 if($("onKeySave"))$("onKeySave").onclick=async()=>{const v=$("onKeyIn").value.trim();if(!v)return;try{await api("/api/online/key",{name:$("onKeySave").dataset.svc,value:v});ON.needKey=null;await tick();toast("Key saved");if(ON.q||!onSvc(ON.kind))onlineSearch();else renderOnline()}catch(e){toast(e.message)}};
 box.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>gotoFile(a.dataset.go));
 if($("onMore"))$("onMore").onclick=()=>{ON.page++;onlineSearch()}}
async function onlineAdd(it){const pl=it.plain;
 if(pl.risky){if(!confirm("GIFs on GIPHY are usually clips owned by someone else (films, shows, memes). Using them in a monetised or public video can get a copyright claim. Download anyway?"))return;it=Object.assign({},it,{as_gif:ON.gif==="gif"})}
 else if(!pl.edit&&!confirm("This licence says no edits are allowed, so you can't cut or change it in a video. Download anyway?"))return;
 if(!pl.commercial&&!confirm("This licence doesn't allow commercial use, so it's not for monetised videos. Download anyway?"))return;
 try{const r=await api("/api/online/add",{item:it,pid,res:ON.res||null});ON.added[it.source+it.id]=r.job;await tick();renderOnline()}catch(e){toast(e.message)}}
let dlSeen={};
function watchDownloads(){for(const d of (S.downloads||[])){const was=dlSeen[d.id];dlSeen[d.id]=d.state;if(was==="downloading"&&d.state==="done")toast("Downloaded "+d.title);if(was==="downloading"&&d.state==="error")toast(d.title+": "+d.error)}if(area==="online")renderOnline()}
function creditsFor(prefix){const out=[],seen=new Set();for(const [f,c] of Object.entries(W.credits||{})){if(!f.startsWith(prefix))continue;if(!seen.has(c.attribution)){seen.add(c.attribution);out.push(c)}}
 for(const l of W.links)if(l.target&&l.target.startsWith(prefix)){const c=(W.credits||{})[l.version];if(c&&!seen.has(c.attribution)){seen.add(c.attribution);out.push(c)}}return out}
async function copyCredits(){const cs=creditsFor(pfolder(pid)+"/");if(!cs.length)return toast("Nothing in this project needs a credit yet.");
 const txt=cs.map(c=>c.attribution+(c.page?" "+c.page:"")).join("\n");try{await navigator.clipboard.writeText(txt);toast("Copied "+cs.length+" credit"+(cs.length>1?"s":"")+", paste them into your video description")}catch(e){openDlg("Credits",`<textarea class="field" rows="10" style="width:100%">${esc(txt)}</textarea><div class="btns"><button class="btn" onclick="closeDlg()">Close</button></div>`)}}

/* ---------------- live layer: instant chat, typing, cursor (LIVE-START) ---------------- */
function makeLive(o){
 const enc=new TextEncoder(),dec=new TextDecoder();
 let ws=null,key=null,topic=null,keyHex=null,bi=0,buf=new Uint8Array(0),ping=null,status="off",retry=null,want=false,backoff=1000,lastIn=0;
 const L={get status(){return status},get lastIn(){return lastIn}};
 const str=s=>{const b=enc.encode(s);return [b.length>>8,b.length&255,...b]};
 const vlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o};
 const pkt=(h,body)=>new Uint8Array([h,...vlen(body.length),...body]);
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
 const setS=s=>{if(status!==s){status=s;o.onstatus&&o.onstatus(s)}};
 async function setup(k){keyHex=k;const raw=new Uint8Array(k.match(/../g).map(h=>parseInt(h,16)));
  key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
  topic="rotlab/v1/"+hex(await crypto.subtle.digest("SHA-256",raw)).slice(0,32)}
 function connect(){if(!want||ws)return;const url=o.brokers[bi%o.brokers.length];setS("connecting");
  try{ws=new WebSocket(url,"mqtt")}catch(e){return fail()}
  ws.binaryType="arraybuffer";buf=new Uint8Array(0);
  ws.onopen=()=>{const cid="rl"+Math.random().toString(36).slice(2,12);
   ws.send(pkt(0x10,[...str("MQTT"),4,2,0,60,...str(cid)]))};
  ws.onmessage=ev=>{const d=new Uint8Array(ev.data),n=new Uint8Array(buf.length+d.length);n.set(buf);n.set(d,buf.length);buf=n;parse()};
  const me_=ws;let done=false;const lost=()=>{if(done)return;done=true;clearTimeout(to);clearInterval(ping);if(ws===me_){if(status==="connecting")bi++;try{me_.close()}catch(e){}fail()}};
  const to=setTimeout(()=>{if(status==="connecting")lost()},10000);
  ws.onclose=lost;ws.onerror=lost}
 function fail(){ws=null;setS(want?"retrying":"off");clearTimeout(retry);if(want){retry=setTimeout(connect,bi%o.brokers.length?300:backoff);if(!(bi%o.brokers.length))backoff=Math.min(backoff*2,60000)}}
 function parse(){while(buf.length>=2){let m=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128}while(b&128);
  if(buf.length<i+len)return;const h=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);const t=h>>4;
  if(t===2){if(body[1]!==0){ws.close();return}ws.send(pkt(0x82,[0,1,...str(topic),0]));backoff=1000;setS("on");ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},45000);o.onconnect&&o.onconnect()}
  else if(t===3){const tl=(body[0]<<8)|body[1];let p=2+tl;if((h>>1)&3)p+=2;got(body.slice(p))}}}
 async function got(payload){try{if(payload.length<13)return;const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:payload.slice(0,12)},key,payload.slice(12));
  const m=JSON.parse(dec.decode(pt));if(m.from===o.id)return;lastIn=Date.now();o.onmessage&&o.onmessage(m)}catch(e){}}
 L.send=async m=>{if(status!=="on"||!ws)return false;m.from=o.id;const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(m))));
  const pl=new Uint8Array(12+ct.length);pl.set(iv);pl.set(ct,12);try{ws.send(pkt(0x30,[...str(topic),...pl]));return true}catch(e){return false}};
 L.update=async info=>{if(!info||!info.enabled){want=false;if(ws)try{ws.close()}catch(e){}setS("off");return}
  if(typeof crypto==="undefined"||!crypto.subtle||typeof WebSocket==="undefined"){setS("unsupported");return}
  if(info.key!==keyHex){if(ws)try{ws.close()}catch(e){}await setup(info.key);o.brokers=info.brokers}
  want=true;connect()};
 return L}
/* (LIVE-END) */
const ME_ID=Math.random().toString(36).slice(2,10);
let liveChats=[],typingUntil={},remoteCur={};
const Live=makeLive({id:ME_ID,brokers:[],
 onstatus:()=>{if(S)renderStatus()},
 onconnect:()=>Live.send({t:"hi",u:S&&S.me}),
 onmessage:m=>{if(!S||m.u===S.me)return;
  if(m.t==="chat"){liveChats.push({ts:m.ts,user:m.u,text:m.text});typingUntil[m.u]=0;renderFeed(false);renderTyping();
   if(!focused&&window.Notification&&Notification.permission==="granted")new Notification("RotLab",{body:m.u+": "+m.text});lastSeenTs=Math.max(lastSeenTs||0,m.ts)}
  else if(m.t==="typing"){typingUntil[m.u]=Date.now()+4000;renderTyping()}
  else if(m.t==="cur"){remoteCur[m.u]=Object.assign(m,{at:Date.now()});drawCursors()}
  else if(m.t==="bye"){delete remoteCur[m.u];drawCursors()}}});
function renderTyping(){const who_=Object.keys(typingUntil).filter(u=>typingUntil[u]>Date.now());$("typing").textContent=who_.length?who_.join(", ")+" is typing...":"";if(who_.length)setTimeout(renderTyping,4100)}
/* cursor: position is sent relative to the middle column, so different window sizes still line up */
let curT=0,curLast=null;
document.addEventListener("mousemove",e=>{if(Live.status!=="on"||!S)return;const r=document.querySelector(".center").getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,inside=x>=0&&x<=1&&y>=0&&y<=1;curLast={x,y,inside};
 const t=Date.now();if(t-curT<80)return;curT=t;sendCur()});
function sendCur(){if(!curLast)return;Live.send({t:"cur",u:S.me,pid,area,dlg:dlgOpen(),x:+curLast.x.toFixed(4),y:+curLast.y.toFixed(4),inside:curLast.inside})}
document.addEventListener("mouseleave",()=>{if(Live.status==="on"&&S)Live.send({t:"cur",u:S.me,pid,area,inside:false,x:0,y:0})});
window.addEventListener("beforeunload",()=>{try{Live.send({t:"bye",u:S.me})}catch(e){}});
function drawCursors(){const box=$("cursors"),r=document.querySelector(".center").getBoundingClientRect();let h="";
 for(const [u,c] of Object.entries(remoteCur)){if(Date.now()-c.at>6000||!c.inside||c.pid!==pid||c.area!==area)continue;
  h+=`<div class="rcur" style="left:${r.left+c.x*r.width}px;top:${r.top+c.y*r.height}px"><svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><path d="M1 1 L1 16 L5 12 L8 19 L10 18 L7 11 L13 11 Z" fill="#b48cff" stroke="#000"/></svg><span>${esc(u)}</span></div>`}
 if(box._h!==h){box.innerHTML=h;box._h=h}}
setInterval(drawCursors,1500);

/* ---------------- main loop ---------------- */
function renderAll(force){if(!S||!S.configured)return;renderProjects();renderForYou();renderTabs();renderCenter(force);renderPeople();renderStatus();renderFeed(false);renderBanners();
 if(openTicket&&dlgOpen()){const r=W.requests.find(x=>x.rid===openTicket);if(r){const ta=$("tkText"),sig=JSON.stringify([r.thread.length,r.status]);if(!(ta&&ta.value)&&!tkFiles.length&&$("dlgBody")._sig!==sig)ticketDlg(r.rid)}}}
let marking=false;
async function tick(){
 try{const r=await fetch("/api/state?focused="+(focused&&!document.hidden?1:0));S=await r.json()}catch(e){$("stSync").textContent="RotLab not responding...";return}
 if(uiHash===null)uiHash=S.ui;else if(S.ui&&S.ui!==uiHash&&!dlgOpen()&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){location.reload();return}
 if(!S.configured){if(!dlgOpen())settingsDlg(true);return}
 W=S.ws;Live.update(S.live);if(!pid||(pid!==S.shared&&!W.projects.some(p=>p.pid===pid&&!p.archived)))pid=S.project;
 if(focused&&!document.hidden)markSeen();
 renderAll(false);notify();watchDownloads();
 if(area==="files"&&(!lib||S.lib_gen!==libGen))loadLib(true);
 if(focused&&!document.hidden&&(S.unread.chat||S.unread.log)&&!marking){marking=true;Promise.all([api("/api/read",{which:"chat"}),api("/api/read",{which:"log"})]).finally(()=>marking=false)}}
(async()=>{await tick();const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("area="))setArea(h.slice(5));else if(h.startsWith("file="))gotoFile(h.slice(5));else if(h.startsWith("ticket="))ticketDlg(h.slice(7));else if(h.startsWith("act="))act(h.slice(4));else if(h.startsWith("project=")){selectProject(h.slice(8))}else renderAll(true)})();
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("file="))gotoFile(h.slice(5));else if(h.startsWith("ticket="))ticketDlg(h.slice(7));else if(h.startsWith("act="))act(h.slice(4));else if(h.startsWith("project="))selectProject(h.slice(8))});
setInterval(tick,2500);
if(window.Notification&&Notification.permission==="default")setTimeout(()=>{try{Notification.requestPermission()}catch(e){}},4000);
</script>

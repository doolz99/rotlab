<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RotLab</title>
<style>
:root{color-scheme:dark;--face:#2b2b2b;--hi:#6a6a6a;--lt:#454545;--sh:#1a1a1a;--dk:#000;--field:#121212;--text:#e8e8e8;--dim:#a8a8a8;--sel:#0a246a;--sel2:#3a6ea5;--note:#e8d27a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0b;color:var(--text);font:13px/1.4 Tahoma,Verdana,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.out{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.in{background:var(--field);box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.btn{background:var(--face);border:0;padding:3px 12px;min-height:25px;cursor:pointer;white-space:nowrap;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:4px 11px 2px 13px}
.btn:disabled{color:#6b6b6b;cursor:default}
.btn.sm{min-height:21px;padding:1px 8px;font-size:12px}
.btn.b{font-weight:bold}
.btn:focus-visible,.tab:focus-visible,.nav:focus-visible{outline:1px dotted #ddd;outline-offset:-5px}
.field{background:var(--field);border:0;padding:4px 6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.field:focus{outline:1px dotted #888;outline-offset:-4px}
select.field{padding:3px 4px}
.dim{color:var(--dim)}
a,.lnk{color:#9db8ff;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.win{position:fixed;inset:0;display:flex;flex-direction:column;padding:3px}
.titlebar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 6px;background:linear-gradient(90deg,var(--sel),var(--sel2));color:#fff;font-weight:bold;user-select:none}
.titlebar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menubar{display:flex;gap:1px;padding:2px;border-bottom:1px solid var(--dk);box-shadow:0 1px 0 var(--lt);position:relative;z-index:20}
.mi{position:relative}
.mi > button{background:none;border:0;padding:2px 9px;cursor:pointer}
.mi > button u{text-decoration:underline}
.mi.open > button{background:var(--sel);color:#fff}
.drop{position:absolute;top:100%;left:0;min-width:230px;padding:3px;display:none;z-index:30}
.mi.open .drop{display:block}
.drop button{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:4px 20px;cursor:pointer}
.drop button:hover,.drop button:focus{background:var(--sel);color:#fff;outline:none}
.drop hr{border:0;border-top:1px solid var(--dk);border-bottom:1px solid var(--lt);margin:3px 2px}
.banner{margin:6px 6px 0;padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:#3a1d1d;box-shadow:inset 0 0 0 1px #7a2c2c}
.banner.info{background:#1b2333;box-shadow:inset 0 0 0 1px #34507e}
.banner.ok{background:#1d2a1d;box-shadow:inset 0 0 0 1px #2f5a3a}
.main{flex:1;min-height:0;display:flex;gap:6px;padding:6px}
.left{width:205px;flex:none;display:flex;flex-direction:column;gap:6px;min-height:0}
.nav{display:flex;align-items:center;gap:8px;padding:5px 8px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.nav.on{background:var(--sel);color:#fff}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--dim)}
.nav.on .n{color:#cfd8ff}
.nav .n.hot{color:var(--note)}
.parts{flex:1;min-height:60px;overflow:auto;padding:5px 3px}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:3px 6px;font-size:12.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.prow.on{background:#1b2333}
.badge{font-size:10.5px;padding:0 5px;border:1px solid #000;white-space:nowrap}
.st0{background:#2a2a2a;color:#bdbdbd}.st1{background:#3a2f12;color:#f0d27a}.st2{background:#0a246a;color:#fff}.st3{background:#1d3a26;color:#9fe0b0}
.center{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.head{padding:7px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h2{font-size:15px;margin:0}
.scroll{flex:1;min-height:0;overflow:auto}
.cats{width:140px;flex:none;padding:4px;overflow:auto}
.cat{display:flex;justify-content:space-between;padding:3px 6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.cat.on{background:var(--sel);color:#fff}
.cat .n{color:var(--dim)}.cat.on .n{color:#cfd8ff}
.sep{height:1px;background:var(--dk);box-shadow:0 1px 0 var(--lt);margin:6px 2px}
.list{flex:1;min-height:120px;overflow:auto;padding:2px}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;z-index:2;text-align:left;font-weight:normal;padding:3px 8px;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi);white-space:nowrap}
td{padding:2px 8px;white-space:nowrap;vertical-align:middle}
tr.row.sel td{background:var(--sel);color:#fff}
tr.row.sel td .dim{color:#cfd8ff}
tr.grp td{color:var(--dim);padding-top:7px;font-size:12px}
td.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.thumb{width:54px;height:30px;background:#1e2430;border:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7d8aa3;font-size:10px}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{display:inline-block;padding:0 5px;border:1px solid #5a5a5a;color:#d6d6d6;font-size:11px;margin-right:3px}
.bub{color:var(--note);font-size:12px}
.detail{padding:8px;display:flex;gap:10px;flex-wrap:wrap;max-height:46%;overflow:auto}
.pv{width:260px;height:146px;flex:none;display:flex;align-items:center;justify-content:center;background:#0e1118}
.pv video,.pv img{max-width:100%;max-height:100%;display:block}
.pv audio{width:94%}
.notes{padding:6px 8px;line-height:1.5;max-height:130px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:0;padding:1px 8px;cursor:pointer;font-size:12px;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi)}
.chip.on{background:var(--sel);color:#fff;box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi)}
.right{width:300px;flex:none;padding:5px;display:flex;flex-direction:column;gap:5px;min-height:0}
.people{padding:5px 8px;display:flex;flex-direction:column;gap:2px}
.dot{width:9px;height:9px;border:1px solid #000;display:inline-block;flex:none;background:#555}
.dot.editing{background:#b48cff}.dot.hub,.dot.online{background:#3fbf6a}
.tabs{display:flex;gap:2px;padding-left:4px}
.tab{background:var(--face);border:0;padding:3px 12px;cursor:pointer;margin-bottom:-3px;position:relative;box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset 2px 2px var(--lt)}
.tab.on{padding-top:5px;margin-top:-2px;z-index:2;font-weight:bold}
.feed{flex:1;min-height:0;overflow:auto;padding:6px 8px;line-height:1.5}
.feed .day{color:var(--dim);font-size:12px;margin-top:6px}
.feed .t{color:var(--dim);margin-right:6px}
.feed .ln{padding:1px 3px}
.feed .ln.new{background:#1d1b12}
.feed .q{color:#d8cfa6;padding-left:44px}
.feed .sub{padding-left:44px;color:var(--dim)}
.newdiv{display:flex;align-items:center;gap:6px;margin:6px 0 3px;color:var(--note);font-size:12px}
.newdiv:before,.newdiv:after{content:"";flex:1;height:1px;background:#8a7a3a}
.status{display:flex;gap:3px;padding:2px}
.status > div{padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* plan */
.seg{display:grid;grid-template-columns:34px 1fr 190px;gap:12px;padding:10px 12px;border-bottom:1px solid #222}
.seg:last-child{border-bottom:0}
.num{font-family:"Courier New",Courier,monospace;font-size:19px;color:#7a7a7a;text-align:right}
.steps{display:flex;margin-top:7px}
.step{flex:1;border:0;font-size:12px;padding:4px 6px;cursor:pointer;color:#bdbdbd;background:#1c1c1c;box-shadow:inset 1px 1px #3a3a3a,inset -1px -1px #000;text-align:left}
.step.past{background:#1d2b22;color:#9fd4b0}
.step.cur{background:var(--sel);color:#fff;font-weight:bold;box-shadow:inset 1px 1px var(--sel2),inset -1px -1px #000}
.sum{display:flex;gap:6px}
.sumc{flex:1;padding:4px 8px;background:#1c1c1c;box-shadow:inset 1px 1px #3a3a3a,inset -1px -1px #000}
.sumc b{font-size:16px;display:block}
fieldset{border:2px groove #4a4a4a;margin:0;padding:7px 10px 9px;min-width:0}
legend{padding:0 4px}
/* board */
.rail{display:flex;gap:6px;overflow:auto;padding:4px 6px;background:#0f0f0f;border-bottom:1px dashed #3a3a3a;align-items:center}
.slip{flex:none;background:#e9e3d2;color:#1a1a1a;padding:3px 9px 4px;font-family:"Courier New",Courier,monospace;font-size:12px;box-shadow:2px 2px 0 #000;border:0;border-top:3px dotted #9a9488;cursor:pointer}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px;flex:1;min-height:0;overflow:auto}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.colh{display:flex;justify-content:space-between;padding:2px 4px;font-weight:bold}
.tk{background:#1c1c1c;border:1px solid #000;box-shadow:inset 1px 1px #3c3c3c;padding:6px 8px 7px;display:flex;flex-direction:column;gap:3px;position:relative;cursor:pointer;text-align:left;width:100%;border-top-width:3px}
.tk:hover{background:#222}
.tk .ty{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.tk .m{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.tk .new{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--note);border:1px solid #000}
.tk.done{opacity:.65}
.post{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #222}
.av{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold;border:1px solid #000;font-size:12px}
.take{background:#1c1c1c;border:1px solid #000;box-shadow:inset 1px 1px #3c3c3c;padding:6px 8px;margin-top:5px;display:flex;flex-direction:column;gap:4px}
.verdict{display:inline-block;padding:0 7px;font-size:12px;border:1px solid}
/* review */
.revlist{width:240px;flex:none;overflow:auto;padding:3px}
.ritem{display:flex;gap:8px;align-items:center;padding:4px 6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.ritem.on{background:var(--sel);color:#fff}
.stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:240px}
.stage img{max-width:100%;max-height:420px;display:block;cursor:crosshair}
.stage video{max-width:100%;max-height:420px;display:block}
.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--note);color:#000;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #000;cursor:pointer}
.marks{position:relative;height:12px;background:#151515;border:1px solid #000;margin-top:4px}
.mark{position:absolute;top:1px;width:4px;height:8px;background:var(--note);margin-left:-2px;cursor:pointer}
.cmt{padding:5px 2px;border-bottom:1px solid #222;display:flex;gap:8px}
.cmt.res{opacity:.5}
/* dialogs */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modalbg.show{display:flex}
.dlg{width:min(600px,94vw);max-height:92vh;display:flex;flex-direction:column;padding:3px}
.dlg.wide{width:min(820px,96vw)}
.dlg .body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .btns .btn{min-width:84px}
label.ck{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.bar{height:16px;padding:2px;display:flex}
.bar i{display:block;height:100%;background:var(--sel2)}
.pbar{height:7px;background:#0d0d0d;border:1px solid #000;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--sel2)}
.dropzone{position:fixed;inset:10px;border:3px dashed #9db8ff;background:rgba(10,36,106,.35);display:none;align-items:center;justify-content:center;font-size:22px;z-index:60;pointer-events:none}
.dropzone.show{display:flex}
.toast{position:fixed;right:14px;bottom:34px;padding:8px 12px;display:none;z-index:70;max-width:380px}
.empty{padding:18px;color:var(--dim)}
@media (max-width:1100px){.right{width:250px}.left{width:175px}}
</style></head>
<body>
<div class="win out">
 <div class="titlebar">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="10" fill="#c0c0c0" stroke="#000"/><rect x="1" y="2" width="14" height="3" fill="#fff" stroke="#000"/><path d="M6 8 L11 10 L6 12 Z" fill="#000"/></svg>
  <span id="title">RotLab</span>
 </div>
 <div class="menubar">
  <div class="mi"><button><u>F</u>ile</button><div class="drop out">
   <button data-act="newproj">New project...</button>
   <button data-act="add">Add files...<span class="dim">Ctrl+O</span></button><hr>
   <button data-act="openproj">Open project folder</button>
   <button data-act="openinbox">Open Inbox folder</button>
   <button data-act="sortinbox">Sort Inbox now</button><hr>
   <button data-act="settings">Settings...</button><hr>
   <button data-act="quit">Quit RotLab</button></div></div>
  <div class="mi"><button><u>P</u>roject</button><div class="drop out">
   <button data-act="projset">Rename / change type...</button>
   <button data-act="uses">Uses another project...</button>
   <button data-act="newpart">Add a part to the outline</button>
   <button data-act="newreq">New request...</button><hr>
   <button data-act="archive">Archive this project</button></div></div>
  <div class="mi"><button><u>V</u>iew</button><div class="drop out">
   <button data-act="v-plan">Plan</button><button data-act="v-board">Board</button><button data-act="v-files">Files</button><button data-act="v-review">Review</button><hr>
   <button data-act="tabchat">Chat</button><button data-act="tablog">Log</button><hr>
   <button data-act="reload">Refresh</button></div></div>
  <div class="mi"><button><u>S</u>ync</button><div class="drop out"><button data-act="sync">Sync status &amp; linking...</button></div></div>
  <div class="mi"><button>P<u>h</u>one</button><div class="drop out"><button data-act="phone">Upload from phone...</button></div></div>
  <div class="mi"><button><u>H</u>elp</button><div class="drop out"><button data-act="about">About RotLab</button></div></div>
 </div>
 <div id="banners"></div>
 <div class="main">
  <div class="left">
   <div class="in" style="padding:6px;display:flex;flex-direction:column;gap:5px">
    <label for="projSel" class="dim" style="font-size:11.5px">Project</label>
    <div style="display:flex;gap:4px"><select id="projSel" class="field" style="flex:1;min-width:0"></select><button class="btn sm" data-act="newproj" title="New project" aria-label="New project">+</button></div>
    <div id="projType" class="dim" style="font-size:11.5px"></div>
   </div>
   <div class="in" style="padding:3px" id="navBox"></div>
   <div class="in parts" id="partsBox"></div>
  </div>
  <div class="center"><div class="view" id="view"></div></div>
  <div class="right out">
   <div class="people in" id="people"></div>
   <div class="tabs"><button class="tab on" id="tabChat">Chat</button><button class="tab" id="tabLog">Log</button></div>
   <div class="feed in" id="feed"></div>
   <div id="chatIn" style="display:flex;gap:6px"><label for="say" class="dim" style="align-self:center">Say:</label><input id="say" class="field" style="flex:1;min-width:0"><button class="btn" id="sendBtn">Send</button></div>
   <div id="logIn" style="display:none;gap:6px;align-items:center"><label for="logf" class="dim">Show:</label><select id="logf" class="field" style="flex:1"><option value="proj">This project</option><option value="all">Everything</option><option value="them">Only the other person</option><option value="mine">Only mine</option></select></div>
  </div>
 </div>
 <div class="status">
  <div class="in" id="stSync" style="flex:1">Sync: starting...</div>
  <div class="in" id="stReq">Requests for you: 0</div>
  <div class="in" id="stInbox">Inbox: 0</div>
  <div class="in" id="stPhone">Phone: -</div>
  <div class="in" id="stVer">v-</div>
 </div>
</div>
<input type="file" id="filePick" multiple style="display:none">
<input type="file" id="takePick" multiple style="display:none">
<div class="dropzone" id="dropzone">Drop files to add them to the project</div>
<div class="toast out" id="toast"></div>
<div class="modalbg" id="modal"><div class="dlg out" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
 <div class="titlebar"><span id="dlgTitle">Dialog</span><button class="btn sm" id="dlgX" aria-label="Close" style="min-height:18px;padding:0 6px">×</button></div>
 <div class="body" id="dlgBody"></div>
</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size=b=>b>=1e9?(b/1e9).toFixed(2)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.ceil(b/1e3))+" KB";
const dur=s=>{if(!isFinite(s)||s==null)return"";s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const tm=ts=>new Date(ts*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayName=ts=>{const d=new Date(ts*1000),t=new Date(),y=new Date(Date.now()-864e5);if(d.toDateString()===t.toDateString())return"Today";if(d.toDateString()===y.toDateString())return"Yesterday";return d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})};
const ago=ts=>{const d=Date.now()/1000-ts;if(d<90)return"just now";if(d<3600)return Math.round(d/60)+" min ago";if(d<86400)return Math.round(d/3600)+" h ago";return Math.round(d/86400)+" days ago"};
const ymd=ts=>{const d=new Date(ts*1000);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const short=p=>String(p||"").split("/").pop();
const TAGS=["B-roll","Interview","Music","SFX","Best","Don't use"];
const TYPE_COLOR={"Sound effect":"#e8d27a","Music":"#6aa9ff","Footage":"#3fbf6a","Graphic":"#e08a3a","Edit":"#ff7a9a","Writing":"#b48cff","Idea":"#9adbd8","Other":"#bdbdbd"};
async function api(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3800)}
function who(u){return u===S.me?"You":u}

let S=null,W=null,pid=null,area="plan",partSel=null,cat="Video",q="",lib=null,libKey="",libGen=-1,selPath=null,tab="chat",focused=document.hasFocus(),uiHash=null,revPath=null;
let readAtOpen={chat:null,log:null},durCache={},openGroups=new Set(),boardFor="all";
try{area=localStorage.getItem("rl_area")||"plan"}catch(e){}
window.addEventListener("focus",()=>{focused=true;tick()});window.addEventListener("blur",()=>focused=false);
const proj=()=>W.projects.find(p=>p.pid===pid);
const isShared=()=>pid===S.shared;

/* ---------------- menus ---------------- */
document.querySelectorAll(".mi > button").forEach(b=>{b.addEventListener("click",e=>{const mi=b.parentElement,was=mi.classList.contains("open");closeMenus();if(!was)mi.classList.add("open");e.stopPropagation()});
 b.addEventListener("mouseenter",()=>{if(document.querySelector(".mi.open")&&!b.parentElement.classList.contains("open")){closeMenus();b.parentElement.classList.add("open")}})});
function closeMenus(){document.querySelectorAll(".mi.open").forEach(m=>m.classList.remove("open"))}
document.addEventListener("click",closeMenus);
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b){closeMenus();act(b.dataset.act,b)}});
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key.toLowerCase()==="o"){e.preventDefault();act("add")}if(e.key==="Escape"){closeMenus();if($("modal").classList.contains("show")&&!dlgLocked)closeDlg()}});
async function act(a,el){try{
 if(a==="add")$("filePick").click();
 else if(a==="newproj")newProjDlg();
 else if(a==="openproj")await api("/api/reveal",{path:isShared()?"Shared":proj().folder});
 else if(a==="openinbox")await api("/api/reveal",{path:"Inbox"});
 else if(a==="sortinbox"){const r=await api("/api/sort_inbox");toast(r.count?"Sorted "+r.count+" file(s) from the Inbox":"The Inbox is empty")}
 else if(a==="settings")settingsDlg(false);
 else if(a==="quit"){if(confirm("Quit RotLab? Sync stops and you'll show as offline until it starts again.")){await api("/api/quit");document.body.innerHTML='<p style="padding:40px;color:#a8a8a8">RotLab stopped. You can close this window.</p>'}}
 else if(a==="projset")projSetDlg();else if(a==="uses")usesDlg();
 else if(a==="newpart")newPart();else if(a==="newreq")reqNewDlg({});
 else if(a==="archive"){if(!isShared()&&confirm("Archive "+proj().name+"? It disappears from the list but nothing is deleted."))await api("/api/ws/project_set",{pid,archived:true});await tick()}
 else if(a.startsWith("v-"))setArea(a.slice(2));
 else if(a==="tabchat")setTab("chat");else if(a==="tablog")setTab("log");
 else if(a==="reload")location.reload();
 else if(a==="sync")syncDlg();else if(a==="phone")phoneDlg();else if(a==="about")aboutDlg();
}catch(e){toast(e.message)}}

/* ---------------- dialogs ---------------- */
let dlgLocked=false;
function openDlg(title,html,opt){opt=opt||{};$("dlgTitle").textContent=title;$("dlgBody").innerHTML=html;dlgLocked=!!opt.locked;$("dlg").classList.toggle("wide",!!opt.wide);$("dlgX").style.display=opt.locked?"none":"";$("modal").classList.add("show");if(!opt.nofocus){const f=$("dlgBody").querySelector("input:not([readonly]),textarea,select");if(f)f.focus()}}
function closeDlg(){$("modal").classList.remove("show");dlgLocked=false;openTicket=null}
$("dlgX").onclick=closeDlg;
const dlgOpen=()=>$("modal").classList.contains("show");

function settingsDlg(first){const st=S?S.settings:{};
 openDlg(first?"Welcome to RotLab":"Settings",`
  ${first?'<div>Type your name. It is what the other person sees next to your chat, requests and changes.</div>':""}
  <label for="sName">Your name:</label><input id="sName" class="field" maxlength="40" value="${esc(S&&S.me||"")}">
  <fieldset><legend>Inbox</legend>
   <label class="ck"><input type="checkbox" id="sSort" ${st.auto_sort!==false?"checked":""}> Sort files dropped in the Inbox automatically (into the project you have open)</label>
   <label class="ck"><input type="checkbox" id="sDate" ${st.date_folders!==false?"checked":""}> Put video and photos in a folder per day</label></fieldset>
  ${st.windows?`<label class="ck"><input type="checkbox" id="sStart" ${st.autostart?"checked":""}> Start RotLab with Windows</label>`:""}
  <label class="ck"><input type="checkbox" id="sGh" ${st.github_updates!==false?"checked":""}> Get new versions from GitHub automatically</label>
  <details><summary class="dim">Advanced</summary><div style="margin-top:6px"><label for="sKey">Syncthing API key (only if RotLab can't find your own Syncthing):</label><input id="sKey" class="field" style="width:100%"></div></details>
  <div class="dim" style="font-size:12px">Workspace folder: ${esc(S?S.root:"")}</div>
  <div class="btns"><button class="btn" id="sOk">OK</button>${first?"":'<button class="btn" id="sCancel">Cancel</button>'}</div>`,{locked:first});
 $("sOk").onclick=async()=>{const b={name:$("sName").value,auto_sort:$("sSort").checked,date_folders:$("sDate").checked,github_updates:$("sGh").checked};if($("sStart"))b.autostart=$("sStart").checked;if($("sKey").value.trim())b.api_key=$("sKey").value.trim();
  try{await api("/api/setup",b);closeDlg();tick()}catch(e){toast(e.message)}};
 if($("sCancel"))$("sCancel").onclick=closeDlg;$("sName").onkeydown=e=>{if(e.key==="Enter")$("sOk").click()};
}
function aboutDlg(){openDlg("About RotLab",`<div style="display:flex;gap:14px;align-items:center"><svg width="40" height="40" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="10" fill="#c0c0c0" stroke="#000"/><rect x="1" y="2" width="14" height="3" fill="#fff" stroke="#000"/><path d="M6 8 L11 10 L6 12 Z" fill="#000"/></svg><div><b>RotLab</b><br>Version ${esc(S.version)}${S.github&&S.github.latest?" · newest on GitHub: "+esc(S.github.latest):""}<br><span class="dim">Projects, requests, review and sync for two people making things together.</span></div></div><div class="btns"><button class="btn" id="aChk">Check for updates</button><button class="btn" onclick="closeDlg()">OK</button></div>`);
 $("aChk").onclick=async()=>{await api("/api/check_updates");toast("Checking GitHub for a new version...");setTimeout(async()=>{await tick();aboutDlg()},5000)}}
function phoneDlg(){const p=S.phone;let h="";
 if(!p.enabled)h='<div>Uploading from a phone is turned off.</div>';else if(p.error)h=`<div style="color:#ffb4b4">${esc(p.error)}</div>`;
 else if(!p.ips.length)h="<div>Connect this PC to Wi-Fi or your phone's hotspot first.</div>";
 else h=`<div>On your phone (same Wi-Fi or hotspot), open the browser and go to:</div><div class="in" style="padding:8px 10px;font-size:20px;font-weight:bold;user-select:all">${p.ips.map(ip=>esc(ip)+":"+p.port).join("<br>")}</div><div>PIN: <b style="font-size:20px;letter-spacing:3px">${esc(p.pin)}</b></div><div class="dim">You can pick the project on the phone. The first time, Windows may ask to allow Python on networks: tick Private and Public.</div>`;
 openDlg("Upload from phone",h+`<div class="btns">${p.enabled?'<button class="btn" id="pNew">New PIN</button>':""}<button class="btn" id="pTog">${p.enabled?"Turn off":"Turn on"}</button><button class="btn" onclick="closeDlg()">Close</button></div>`);
 if($("pNew"))$("pNew").onclick=async()=>{if(confirm("Make a new PIN?")){await api("/api/phone",{new_pin:true});await tick();phoneDlg()}};
 $("pTog").onclick=async()=>{await api("/api/phone",{enabled:!p.enabled});await tick();phoneDlg()}}
function syncDlg(){const st=S.syncthing,sy=S.sync||{};let h="";
 if(sy.installing)h=`<div>${esc(sy.message||"Setting up...")}</div><div class="bar in"><i style="width:${sy.progress||0}%"></i></div>`;
 else if(!st.ok&&st.mode==="missing")h=`<div>Sync isn't set up on this PC yet. RotLab uses Syncthing (free, private, PC to PC) to keep the workspace the same on both computers.</div>${sy.error?`<div style="color:#ffb4b4">${esc(sy.error)}</div>`:""}<div><button class="btn" id="yInstall">Set up sync (about 12 MB, once)</button></div>`;
 else if(!st.ok)h=`<div style="color:#ffd27a">${esc(st.error)}</div>`;
 else{const f=st.folder;h=`<div>${st.mode==="builtin"?"Built-in sync":"Using your installed Syncthing"} · ${!f?"workspace not added":(f.needFiles>0?"syncing, "+f.needFiles+" files to go":"workspace up to date")}</div>`;
  h+=(st.pending||[]).map(p=>`<div class="banner ok" style="margin:0"><span style="flex:1"><b>${esc(p.name)}</b> wants to join</span><button class="btn sm" data-acc="${esc(p.id)}" data-nm="${esc(p.name)}">Accept</button><button class="btn sm" data-dis="${esc(p.id)}">Ignore</button></div>`).join("");
  const devs=(st.devices||[]).filter(d=>d.shared);
  h+=`<fieldset><legend>Linked PCs</legend>${devs.length?devs.map(d=>`<div style="display:flex;gap:8px;align-items:center"><span class="dot ${d.connected?"online":""}"></span><span style="flex:1">${esc(d.name)}</span><span class="dim">${d.connected?(d.completion!=null&&d.completion<100?"syncing "+Math.floor(d.completion)+"%":"connected, in sync"):"offline"}</span></div>`).join(""):'<div class="dim">Not linked with anyone yet.</div>'}</fieldset>
   <fieldset><legend>Invite a friend</legend><div style="display:flex;gap:6px"><input id="yCode" class="field" readonly style="flex:1;min-width:0"><button class="btn" id="yMake">Make code</button></div></fieldset>
   <fieldset><legend>Join</legend><div style="display:flex;gap:6px"><input id="yJoin" class="field" placeholder="VEGASHUB-..." style="flex:1;min-width:0"><button class="btn" id="yJoinBtn">Join</button></div></fieldset>`}
 openDlg("Sync",h+'<div class="btns"><button class="btn" onclick="closeDlg()">Close</button></div>');
 if($("yInstall"))$("yInstall").onclick=async()=>{await api("/api/sync/install");setTimeout(syncDlg,600)};
 if($("yMake"))$("yMake").onclick=async()=>{try{const r=await api("/api/sync/invite");$("yCode").value=r.code;$("yCode").select();try{await navigator.clipboard.writeText(r.code);toast("Invite code copied")}catch(e){}}catch(e){toast(e.message)}};
 if($("yJoinBtn"))$("yJoinBtn").onclick=async()=>{try{const r=await api("/api/sync/join",{code:$("yJoin").value});toast("Request sent to "+(r.friend||"your friend")+". They just need to click Accept.");closeDlg()}catch(e){toast(e.message)}};
 $("dlgBody").querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{await api("/api/sync/accept",{id:b.dataset.acc,name:b.dataset.nm});toast("Linked.");await tick();syncDlg()});
 $("dlgBody").querySelectorAll("[data-dis]").forEach(b=>b.onclick=async()=>{await api("/api/sync/dismiss",{id:b.dataset.dis});await tick();syncDlg()})}

/* ---------------- projects ---------------- */
function typeOptions(sel){return Object.entries(W.types).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(v.label)}${v.apps?" ("+esc(v.apps)+")":""}</option>`).join("")}
function newProjDlg(){openDlg("New project",`<div class="grid2"><label for="npName">Name:</label><input id="npName" class="field" placeholder="e.g. Park video, Park theme, Title card">
 <label for="npType">Type:</label><select id="npType" class="field">${typeOptions("video")}</select></div>
 <div class="dim" style="font-size:12px">A folder with the usual sub-folders is made inside the workspace and synced to the other PC.</div>
 <div class="btns"><button class="btn" id="npOk">Create</button><button class="btn" onclick="closeDlg()">Cancel</button></div>`);
 $("npOk").onclick=async()=>{try{const r=await api("/api/ws/project_new",{name:$("npName").value,type:$("npType").value});pid=r.pid;closeDlg();lib=null;await tick();setArea("plan")}catch(e){toast(e.message)}};
 $("npName").onkeydown=e=>{if(e.key==="Enter")$("npOk").click()}}
function projSetDlg(){if(isShared())return toast("Shared isn't a project. Pick a project first.");const p=proj();
 openDlg("Project: "+p.name,`<div class="grid2"><label for="psName">Name:</label><input id="psName" class="field" value="${esc(p.name)}"><label for="psType">Type:</label><select id="psType" class="field">${typeOptions(p.type)}</select><span class="dim">Folder</span><span>${esc(p.folder)}</span></div>
 <div class="btns"><button class="btn" id="psOk">OK</button><button class="btn" onclick="closeDlg()">Cancel</button></div>`);
 $("psOk").onclick=async()=>{await api("/api/ws/project_set",{pid,name:$("psName").value,type:$("psType").value});closeDlg();tick()}}
function usesDlg(){if(isShared())return toast("Pick a project first.");const others=W.projects.filter(p=>p.pid!==pid&&!p.archived);
 if(!others.length)return toast("Make another project first (File → New project).");
 openDlg("Use another project in "+proj().name,`<div class="dim">Bring the latest export of another project into this one. When they export a new version, you get an "Update" button.</div>
 <div class="grid2"><label for="usSrc">Project:</label><select id="usSrc" class="field">${others.map(p=>`<option value="${p.pid}">${esc(p.name)} (${esc(p.type_label)})</option>`).join("")}</select>
 <label for="usCat">Which exports:</label><select id="usCat" class="field"><option value="Any">Any kind</option><option value="Audio">Audio (mixdowns)</option><option value="Images">Images</option><option value="Video">Video</option><option value="Graphics">Graphics</option></select></div>
 <div id="usPrev" class="in" style="padding:6px 8px;min-height:40px"></div>
 <div class="btns"><button class="btn" id="usOk">Link it</button><button class="btn" onclick="closeDlg()">Cancel</button></div>`);
 const prev=async()=>{const r=await api("/api/ws/outputs",{pid:$("usSrc").value,cat:$("usCat").value});$("usPrev").innerHTML=r.items.length?"Newest export: <b>"+esc(short(r.items[0].path))+"</b> <span class='dim'>"+esc(ago(r.items[0].mtime))+" · "+r.items.length+" version(s)</span>":"<span class='dim'>No exports yet. Exports are files in that project's Exports folder.</span>"};
 $("usSrc").onchange=prev;$("usCat").onchange=prev;prev();
 $("usOk").onclick=async()=>{try{await api("/api/ws/link_new",{pid,src:$("usSrc").value,cat:$("usCat").value});closeDlg();toast("Linked. The file is in this project's Linked folder.");tick()}catch(e){toast(e.message)}}}

/* ---------------- left column ---------------- */
function renderLeft(){
 const sel=$("projSel"),opts=W.projects.filter(p=>!p.archived).map(p=>`<option value="${p.pid}">${esc(p.name)}</option>`).join("")+`<option value="${S.shared}">Shared (all projects)</option>`;
 if(sel._o!==opts){sel.innerHTML=opts;sel._o=opts}sel.value=pid;
 $("projType").textContent=isShared()?"Files every project can use":(proj()?proj().type_label+" project"+(proj().exists?"":" · folder still syncing"):"");
 const myReq=W.requests.filter(r=>r.pid===pid&&needsMe(r)).length,openReq=W.requests.filter(r=>r.pid===pid&&["open","working","review"].includes(r.status)).length;
 const unrev=W.comments.filter(c=>!c.resolved&&c.user!==S.me&&c.file.startsWith((isShared()?"Shared":proj()?.folder||"")+"/")).length;
 const nav=[["plan","Plan",isShared()?"":(partsOf().length+" parts")],["board","Board",myReq?myReq+" for you":(openReq?openReq+" open":""),myReq],["files","Files",""],["review","Review",unrev?unrev+" comments":""]];
 const h=nav.map(([k,l,n,hot])=>`<button class="nav ${area===k?"on":""}" data-area="${k}">${l}<span class="n ${hot?"hot":""}">${esc(n)}</span></button>`).join("");
 if($("navBox")._h!==h){$("navBox").innerHTML=h;$("navBox")._h=h;$("navBox").querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>setArea(b.dataset.area))}
 let ph="";
 if(!isShared()){const ps=partsOf(),stg=proj().stages;
  ph=`<div class="dim" style="font-size:11.5px;padding:0 6px 4px">Parts</div>`+(ps.length?ps.map(p=>`<button class="prow ${partSel===p.part?"on":""}" data-part="${p.part}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="badge st${p.stage}">${esc(stg[p.stage])}</span></button>`).join(""):`<div class="dim" style="padding:2px 6px;font-size:12px">No outline yet.</div>`)+`<div style="padding:5px 6px"><button class="btn sm" data-act="newpart">+ Part</button></div>`;
  const uses=W.links.filter(l=>l.pid===pid),used=W.links.filter(l=>l.src===pid);
  if(uses.length||used.length)ph+=`<div class="sep"></div><div class="dim" style="font-size:11.5px;padding:0 6px">Links</div>`+uses.map(l=>`<div style="padding:2px 6px;font-size:12px">uses <a data-proj="${l.src}">${esc(pname(l.src))}</a>${l.update?' <span style="color:var(--note)">new!</span>':""}</div>`).join("")+used.map(l=>`<div style="padding:2px 6px;font-size:12px" class="dim">used in <a data-proj="${l.pid}">${esc(pname(l.pid))}</a></div>`).join("")}
 if($("partsBox")._h!==ph){$("partsBox").innerHTML=ph;$("partsBox")._h=ph;
  $("partsBox").querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{partSel=b.dataset.part;setArea("plan")});
  $("partsBox").querySelectorAll("[data-proj]").forEach(b=>b.onclick=()=>selectProject(b.dataset.proj))}
}
$("projSel").onchange=()=>selectProject($("projSel").value);
function selectProject(p){pid=p;partSel=null;selPath=null;revPath=null;lib=null;api("/api/ws/select",{pid}).catch(()=>{});renderAll(true)}
function setArea(a){area=a;try{localStorage.setItem("rl_area",a)}catch(e){}if(a!=="plan")partSel=a==="board"?partSel:null;api("/api/view",{view:({plan:"Plan",board:"the Board",files:"Files",review:"Review"})[a]+(proj()?" of "+proj().name:"")}).catch(()=>{});renderAll(true)}
const pname=id=>id===S.shared?"Shared":(W.projects.find(p=>p.pid===id)||{}).name||"?";
const partsOf=()=>W.parts.filter(p=>p.pid===pid);
function needsMe(r){if(r.status==="review")return r.by===S.me;if(r.status==="open")return r.by!==S.me&&(r.to==="anyone"||r.to===S.me);if(r.status==="working")return false;return false}

/* ---------------- centre ---------------- */
let viewKey="";
function renderCenter(force){
 const key=area+"|"+pid+"|"+partSel;
 if(area==="files"){if(force||viewKey!==key){viewKey=key;filesShell()}loadLib(force);return}
 if(area==="review"){if(force||viewKey!==key){viewKey=key;reviewShell()}renderReview(force);return}
 viewKey=key;
 const h=area==="board"?boardHtml():(partSel&&!isShared()?partHtml():planHtml());
 const v=$("view");
 if(v._h===h&&!force)return;
 // keep the script editor if the user is typing in it
 if(document.activeElement&&document.activeElement.id==="scr"&&v._h&&!force&&area==="plan"&&partSel)return;
 v.innerHTML=h;v._h=h;bindCenter()}

function stageSteps(p,stg){return `<div class="steps" role="group" aria-label="Stage">${stg.map((nm,i)=>`<button class="step ${i<p.stage?"past":i===p.stage?"cur":""}" data-stage="${i}" data-pt="${p.part}">${esc(nm)}</button>`).join("")}</div>`}
function planHtml(){
 if(isShared())return `<div class="out head"><h2>Shared</h2><span class="dim">Files every project can use: music, sound effects, fonts, logos, references.</span></div><div class="in empty">Shared has no outline. Open <a data-go-area="files">Files</a> to see what's in it.</div>`;
 const p=proj(),ps=partsOf(),stg=p.stages,counts=stg.map((_,i)=>ps.filter(x=>x.stage===i).length);
 const uses=W.links.filter(l=>l.pid===pid),used=W.links.filter(l=>l.src===pid);
 let h=`<div class="out head" style="flex-direction:column;align-items:stretch"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>${esc(p.name)}</h2><span class="dim">${esc(p.type_label)} · ${ps.length} part${ps.length===1?"":"s"}</span><span style="flex:1"></span><button class="btn sm" data-act="newpart">+ Add part</button><button class="btn sm" data-act="uses">Uses...</button></div>
  ${ps.length?`<div class="sum">${stg.map((nm,i)=>`<div class="sumc"><span class="dim">${esc(nm)}</span><b>${counts[i]}</b></div>`).join("")}</div>`:""}</div>`;
 if(uses.length||used.length){h+=`<div class="in" style="padding:6px 10px">`+uses.map(l=>`<div style="display:flex;gap:8px;align-items:center;padding:2px 0;flex-wrap:wrap">Uses <b>${esc(pname(l.src))}</b> → <span class="dim">${esc(l.target)}</span> <span class="dim">(${esc(short(l.version))})</span>${l.update?` <span style="color:var(--note)">· new version ${esc(short(l.newest))}</span> <button class="btn sm" data-lupd="${l.lid}" data-v="${esc(l.newest)}">Update</button>`:""}<button class="btn sm" data-lver="${l.lid}">Versions...</button></div>`).join("")+used.map(l=>`<div class="dim" style="padding:2px 0">Used in <b>${esc(pname(l.pid))}</b> (${esc(short(l.version))})</div>`).join("")+`</div>`}
 h+=`<div class="in scroll" style="padding:2px 0">`;
 if(!ps.length)h+=`<div class="empty">No outline yet. That's fine: the Board and Files work without one.<br><br>Add parts if it helps, e.g. ${p.type==="music"?"Intro, Verse, Drop, Outro":p.type==="art"?"Sketch, Line art, Colour":"Intro, Part 1, Interview, Outro"}.<br><br><button class="btn" data-act="newpart">+ Add the first part</button></div>`;
 ps.forEach((x,i)=>{const rq=W.requests.filter(r=>r.part===x.part),done=rq.filter(r=>r.status==="done").length;
  h+=`<div class="seg"><div class="num">${String(i+1).padStart(2,"0")}</div><div><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><a data-open-part="${x.part}" style="font-size:14px;font-weight:bold;color:var(--text)">${esc(x.name)}</a><span class="dim">${esc(x.time)}</span></div>
   <div style="margin-top:3px;color:#d0d0d0">${x.desc?esc(x.desc):'<span class="dim">No description.</span>'}</div>${stageSteps(x,stg)}</div>
   <div style="font-size:12px;display:flex;flex-direction:column;gap:3px"><span class="dim">Requests: <span style="color:var(--text)">${rq.length?done+" of "+rq.length+" done":"none"}</span></span><span class="dim">Script: <span style="color:var(--text)">${x.script?"written":"-"}</span></span><span style="display:flex;gap:4px;margin-top:3px"><button class="btn sm" data-open-part="${x.part}">Open</button><button class="btn sm" data-req-part="${x.part}">+ Request</button></span></div></div>`});
 return h+`</div>`}
function partHtml(){const x=W.parts.find(p=>p.part===partSel);if(!x){partSel=null;return planHtml()}
 const p=proj(),ps=partsOf(),i=ps.indexOf(x),rq=W.requests.filter(r=>r.part===x.part);
 return `<div class="out head"><a data-back-plan>Plan</a><span class="dim">›</span><h2>${String(i+1).padStart(2,"0")} · ${esc(x.name)}</h2><span style="flex:1"></span>
  ${i>0?`<button class="btn sm" data-open-part="${ps[i-1].part}">‹ ${esc(ps[i-1].name)}</button>`:""}${i<ps.length-1?`<button class="btn sm" data-open-part="${ps[i+1].part}">${esc(ps[i+1].name)} ›</button>`:""}</div>
 <div class="scroll" style="display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start">
  <div style="flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:8px">
   <fieldset><legend>Details</legend><div class="grid2"><label for="ptName">Name:</label><input id="ptName" class="field" value="${esc(x.name)}"><label for="ptTime">Time:</label><input id="ptTime" class="field" value="${esc(x.time)}" placeholder="e.g. 0:20–1:50"><label for="ptDesc">Description:</label><input id="ptDesc" class="field" value="${esc(x.desc)}"></div>${stageSteps(x,p.stages)}</fieldset>
   <fieldset><legend>Script &amp; notes <span class="dim">${x.script_by?"· last edited by "+esc(who(x.script_by))+", "+esc(dayName(x.script_ts).toLowerCase())+" "+esc(tm(x.script_ts)):""}</span></legend>
    <label for="scr" class="dim" style="font-size:12px">Shared with everyone on the project. Saves as you type.</label>
    <textarea id="scr" class="field" style="width:100%;height:240px;resize:vertical;font-family:'Courier New',Courier,monospace;font-size:12.5px;line-height:1.6;margin-top:4px">${esc(x.script)}</textarea>

 const h=ppl.map(p=>`<div style="display:flex;gap:8px;align-items:center"><span class="dot ${p.live}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(who(p.user))}</b>${p.live==="offline"?'<span class="dim">: offline'+(p.ts?", seen "+esc(dayName(p.ts).toLowerCase())+" "+esc(tm(p.ts)):"")+"</span>":": "+esc(p.status.text||p.live)}</span></div>`).join("");
 if($("people")._h!==h){$("people").innerHTML=h;$("people")._h=h}}
function setTab(t){tab=t;$("tabChat").classList.toggle("on",t==="chat");$("tabLog").classList.toggle("on",t==="log");$("chatIn").style.display=t==="chat"?"flex":"none";$("logIn").style.display=t==="log"?"flex":"none";readAtOpen[t]=null;if(S&&S.configured)renderFeed(true)}
$("tabChat").onclick=()=>setTab("chat");$("tabLog").onclick=()=>setTab("log");$("logf").onchange=()=>renderFeed(true);
function fileLink(f){return `<a data-go="${esc(f)}">${esc(short(f))}</a>`}
function logHtml(e){const u=`<b>${esc(who(e.user))}</b>`,files=e.files||[],n=e.count||files.length,fld=e.folder&&e.folder!=="."?e.folder:"the top folder";
 const grp=(verb,prep)=>{if(n===1&&files[0])return `${u} ${verb} ${fileLink(files[0])} ${prep} ${esc(fld)}`;const open=openGroups.has(e.id);return `${u} ${verb} ${n} files ${prep} ${esc(fld)} <a data-grp="${esc(e.id)}">[${open?"-":"+"}]</a>`+(open?`<div class="sub">${files.map(f=>`<div>${fileLink(f)}</div>`).join("")}</div>`:"")};
 switch(e.type){case"files":if(e.action==="added")return grp("added","to");if(e.action==="modified")return grp("changed","in");if(e.action==="restored")return `${u} restored ${fileLink(files[0])}`;
   if(e.action==="deleted")return n===1?`${u} deleted ${esc(short(files[0]))} from ${esc(fld)}${e.user!==S.me?` <a data-undel="${esc(files[0])}">Restore</a>`:""}`:`${u} deleted ${n} files from ${esc(fld)}`;
   if(e.action==="renamed"){const ps=e.pairs||[];return ps.length===1?`${u} moved ${esc(short(ps[0][0]))} → ${fileLink(ps[0][1])}`:`${u} renamed/moved ${ps.length} files`}return `${u} ${esc(e.action)} ${n} files`;
  case"saved":return `${u} saved ${fileLink(e.file)} <a data-hist="${esc(e.file)}">(history)</a>`;
  case"upload":return `${u} uploaded ${e.count} file${e.count>1?"s":""}${e.via==="phone"?" from phone":""} → ${esc(e.folder)}`+(e.note?`<div class="q">“${esc(e.note)}”</div>`:"");
  case"sorted":return `${u} sorted ${e.count} file${e.count>1?"s":""} from the Inbox → ${esc(e.folder)}`;
  case"note":return `${u} noted on ${fileLink(e.file)}: “${esc(e.text)}”`;
  case"restore":return `${u} restored ${esc(short(e.file))} to an earlier save`;
  case"joined":return `${u} started using RotLab`;case"sync_join":return `${u} asked to join ${e.friend?esc(e.friend)+"'s":"a"} workspace`;case"sync_accept":return `${u} linked with ${esc(e.device)}`;case"updated":return `${u}'s RotLab updated to v${esc(e.version)}`}
 return null}
function wsLogHtml(e){const u=`<b>${esc(who(e.user))}</b>`,r=W.requests.find(x=>x.rid===e.rid),rl=r?`<a data-ticket="${r.rid}">#${r.num} ${esc(r.title)}</a>`:"a request",pt=W.parts.find(x=>x.part===e.part),pr=W.projects.find(x=>x.pid===e.pid);
 switch(e.kind){case"proj_new":return `${u} made a new ${esc((W.types[e.type]||{}).label||"")} project <b>${esc(e.name)}</b>`;case"proj_set":return e.archived?`${u} archived ${esc(pname(e.pid))}`:e.name?`${u} renamed a project to <b>${esc(e.name)}</b>`:null;
  case"part_new":return `${u} added the part <b>${esc(e.name)}</b>${pr?" to "+esc(pr.name):""}`;
  case"part_set":if(e.stage!=null&&pt){const p=W.projects.find(x=>x.pid===pt.pid);return `${u} moved <b>${esc(pt.name)}</b> to <b>${esc(p?p.stages[e.stage]:e.stage)}</b>`}return null;
  case"req_new":return `${u} posted ${rl}${e.to&&e.to!=="anyone"?" for "+esc(who(e.to)):""}`;case"req_claim":return `${u} took ${rl}`;case"req_submit":return `${u} sent a take for ${rl}`;
  case"req_review":return e.verdict==="approve"?`${u} approved ${rl}`:`${u} asked for changes on ${rl}`;case"req_comment":return `${u} commented on ${rl}`;case"req_status":return e.status==="cancelled"?`${u} cancelled ${rl}`:null;
  case"rev_comment":return `${u} commented on ${fileLink(e.file)}${e.t!=null?" at "+dur(e.t):""}: “${esc(e.text)}”`;
  case"link_new":return `${u} linked ${esc(pname(e.src))} into ${esc(pname(e.pid))}`;case"link_set":return e.version?`${u} updated a link to ${esc(short(e.version))}`:null}return null}
function inProj(e){if(isShared())return true;const f=proj()?proj().folder+"/":"";const anyFile=[e.file,...(e.files||[])].filter(Boolean);if(anyFile.length)return anyFile.some(x=>x.startsWith(f));
 if(e.pid)return e.pid===pid;if(e.rid){const r=W.requests.find(x=>x.rid===e.rid);return r&&r.pid===pid}if(e.part){const p=W.parts.find(x=>x.part===e.part);return p&&p.pid===pid}return true}
function renderFeed(scrollEnd){const box=$("feed"),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<30,rd=S.read||{};if(readAtOpen[tab]===null)readAtOpen[tab]=rd[tab]||0;const since=readAtOpen[tab];let rows;
 if(tab==="chat")rows=S.chat.map(m=>Object.assign({},m,{_h:`<b>${esc(who(m.user))}</b>: ${linkify(m.text)}`})).concat(W.events.filter(e=>["req_new","req_review"].includes(e.kind)).map(e=>Object.assign({},e,{_h:`<span class="dim" style="font-style:italic">${wsLogHtml(e)}</span>`}))).sort((a,b)=>a.ts-b.ts);
 else{const f=$("logf").value;rows=S.log.map(e=>Object.assign({},e,{_h:logHtml(e)})).concat(W.events.map(e=>Object.assign({},e,{_h:wsLogHtml(e)}))).filter(e=>e._h&&(f==="all"||f==="proj"&&inProj(e)||f==="mine"&&e.user===S.me||f==="them"&&e.user!==S.me)).sort((a,b)=>a.ts-b.ts).slice(-300)}
 let h="",last="",div=false;for(const e of rows){const d=dayName(e.ts);if(d!==last){h+=`<div class="day">${esc(d)}</div>`;last=d}const isNew=e.user!==S.me&&e.ts>since;if(isNew&&!div){h+='<div class="newdiv">new since you were last here</div>';div=true}h+=`<div class="ln ${isNew?"new":""}"><span class="t">${esc(tm(e.ts))}</span>${e._h}</div>`}
 if(!rows.length)h=`<div class="dim">${tab==="chat"?"No messages yet. Say hi.":"Nothing has happened yet."}</div>`;
 if(box._last!==h){box.innerHTML=h;box._last=h;if(scrollEnd||atEnd)box.scrollTop=box.scrollHeight}}
function linkify(t){let h=esc(t);h=h.replace(/#(\d{1,4})\b/g,(m,n)=>{const r=W.requests.find(x=>x.pid===pid&&x.num===+n);return r?`<a data-ticket="${r.rid}">#${n}</a>`:m});return h}
$("feed").addEventListener("click",async e=>{const a=e.target.closest("a");if(!a)return;
 if(a.dataset.go)gotoFile(a.dataset.go);else if(a.dataset.ticket)ticketDlg(a.dataset.ticket);
 else if(a.dataset.grp){openGroups.has(a.dataset.grp)?openGroups.delete(a.dataset.grp):openGroups.add(a.dataset.grp);$("feed")._last="";renderFeed(false)}
 else if(a.dataset.hist)historyDlg(a.dataset.hist);else if(a.dataset.undel){try{await api("/api/restore_deleted",{file:a.dataset.undel});toast("Restored")}catch(err){toast(err.message)}}});
async function sendChat(){const t=$("say").value.trim();if(!t)return;$("say").value="";await api("/api/chat",{text:t}).catch(e=>toast(e.message));readAtOpen.chat=Date.now()/1000;tick()}
$("sendBtn").onclick=sendChat;$("say").onkeydown=e=>{if(e.key==="Enter")sendChat()};

/* ---------------- banners, status ---------------- */
function renderBanners(){let h="";
 if(S.clash)h+=`<div class="banner warn">&#9888; <b>${esc(S.clash.user)}</b> also has <b>${esc(S.clash.project)}</b> open. Only one of you should save it.</div>`;
 for(const p of (S.syncthing.pending||[]))h+=`<div class="banner ok"><span style="flex:1"><b>${esc(p.name)}</b> wants to join this workspace</span><button class="btn sm" data-acc="${esc(p.id)}" data-nm="${esc(p.name)}">Accept</button><button class="btn sm" data-dis="${esc(p.id)}">Ignore</button></div>`;
 if(S.update&&S.update.pending)h+=`<div class="banner info"><span style="flex:1">A new version (v${esc(S.update.version)}) is ready.</span><button class="btn sm" id="bRestart">Restart now</button></div>`;
 if(!S.syncthing.ok&&S.syncthing.mode==="missing")h+=`<div class="banner info"><span style="flex:1">File sync isn't set up on this PC yet.</span><button class="btn sm" data-act="sync">Set up...</button></div>`;
 if($("banners")._last!==h){$("banners").innerHTML=h;$("banners")._last=h;
  $("banners").querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{await api("/api/sync/accept",{id:b.dataset.acc,name:b.dataset.nm});toast("Linked.");tick()});
  $("banners").querySelectorAll("[data-dis]").forEach(b=>b.onclick=async()=>{await api("/api/sync/dismiss",{id:b.dataset.dis});tick()});
  if($("bRestart"))$("bRestart").onclick=async()=>{await api("/api/restart",{window:true}).catch(()=>{});document.body.innerHTML='<p style="padding:40px;color:#a8a8a8">Updating... RotLab reopens in a few seconds.</p>';setTimeout(()=>window.close(),1500)}}}
function renderStatus(){const st=S.syncthing,sy=S.sync||{};let t;
 if(sy.installing)t="Sync: setting up... "+(sy.progress||0)+"%";else if(!st.ok)t="Sync: "+(st.mode==="missing"?"not set up":st.error);
 else{const f=st.folder,linked=(st.devices||[]).filter(d=>d.shared),con=linked.filter(d=>d.connected);t=!linked.length?"Sync: not linked with anyone yet":(con.length?"Synced with "+con.map(d=>d.name).join(", "):"Other PC offline")+(f?(f.needFiles>0?" · syncing "+f.needFiles+" files":" · up to date"):"")}
 const up=S.upload;if(up&&up.total)t+=` · receiving ${up.name} ${Math.floor(up.got/up.total*100)}%`;
 $("stSync").textContent=t;$("stReq").textContent="Requests for you: "+(S.unread.requests||0);$("stInbox").textContent="Inbox: "+(S.inbox?S.inbox+" waiting":"empty");
 const p=S.phone;$("stPhone").textContent=p.enabled&&p.ips.length?"Phone: "+p.ips[0]+":"+p.port+" · PIN "+p.pin:"Phone: off";$("stVer").textContent="v"+S.version;
 $("tabChat").textContent="Chat"+(S.unread.chat&&!(tab==="chat"&&focused)?" ("+S.unread.chat+")":"");$("tabLog").textContent="Log"+(S.unread.log&&!(tab==="log"&&focused)?" ("+S.unread.log+")":"");
 $("title").textContent="RotLab: "+(isShared()?"Shared":proj()?proj().name:"")+" · "+S.root;document.title=(S.unread.chat?"("+S.unread.chat+") ":"")+"RotLab"}
let lastSeenTs=null;
function notify(){const evs=S.chat.concat(W.events.filter(e=>["req_new","req_submit","req_review"].includes(e.kind))).filter(e=>e.user!==S.me);const newest=evs.reduce((a,e)=>Math.max(a,e.ts),0);
 if(lastSeenTs!==null&&!focused)for(const e of evs.filter(e=>e.ts>lastSeenTs).slice(-3)){const body=e.text&&!e.kind?e.user+": "+e.text:(wsLogHtml(e)||"").replace(/<[^>]+>/g,"");if(window.Notification&&Notification.permission==="granted")new Notification("RotLab",{body})}
 lastSeenTs=Math.max(lastSeenTs||0,newest)}

/* ---------------- main loop ---------------- */
function renderAll(force){if(!S||!S.configured)return;renderLeft();renderCenter(force);renderPeople();renderStatus();renderFeed(false);renderBanners();
 if(openTicket&&dlgOpen()){const r=W.requests.find(x=>x.rid===openTicket);if(r){const ta=$("tkText");if(!(ta&&ta.value)&&$("dlgBody")._sig!==JSON.stringify([r.thread.length,r.status])){$("dlgBody")._sig=JSON.stringify([r.thread.length,r.status]);ticketDlg(r.rid)}}}}
let marking=false;
async function tick(){
 try{const r=await fetch("/api/state?focused="+(focused&&!document.hidden?1:0));S=await r.json()}catch(e){$("stSync").textContent="RotLab not responding...";return}
 if(uiHash===null)uiHash=S.ui;else if(S.ui&&S.ui!==uiHash&&!dlgOpen()&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){location.reload();return}
 if(!S.configured){if(!dlgOpen())settingsDlg(true);return}
 W=S.ws;if(!pid||(pid!==S.shared&&!W.projects.some(p=>p.pid===pid&&!p.archived)))pid=S.project;
 renderAll(false);notify();
 if(area==="files"&&(!lib||S.lib_gen!==libGen))loadLib(true);
 if(focused&&!document.hidden&&S.unread[tab]&&!marking){marking=true;api("/api/read",{which:tab}).finally(()=>marking=false)}}
setTab("chat");
(async()=>{await tick();const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("area="))setArea(h.slice(5));else if(h.startsWith("file="))gotoFile(h.slice(5));else if(h.startsWith("ticket="))ticketDlg(h.slice(7));else renderAll(true)})();
setInterval(tick,2500);
if(window.Notification&&Notification.permission==="default")setTimeout(()=>{try{Notification.requestPermission()}catch(e){}},4000);
</script>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RotLab</title>
<style>
:root{color-scheme:dark;--face:#2b2b2b;--hi:#6a6a6a;--lt:#454545;--sh:#1a1a1a;--dk:#000;--field:#121212;--text:#e8e8e8;--dim:#a8a8a8;--sel:#0a246a;--sel2:#3a6ea5;--note:#e8d27a;--me:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2b2b;color:var(--text);font:12.5px/1.4 Tahoma,Verdana,"Segoe UI",sans-serif;user-select:none}
body.desk{background:#1d2a2c;overflow:auto}
button,input,select{font:inherit;color:inherit}
.out{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.in{background:var(--field);box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.btn{background:var(--face);border:0;padding:1px 9px;min-height:21px;cursor:pointer;white-space:nowrap;font-size:12px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk)}
.btn:disabled{color:#6b6b6b;cursor:default}
.btn.b{font-weight:bold}
.field{background:var(--field);border:0;padding:2px 6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);outline:none;user-select:text}
.dim{color:var(--dim)}
.tbar{display:flex;align-items:center;gap:5px;padding:2px 3px 2px 6px;background:linear-gradient(90deg,var(--sel),var(--sel2));color:#fff;font-weight:bold;font-size:11.5px;height:20px;flex:none;cursor:default}
.tbar.grey{background:#555}
.tbar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb{background:var(--face);color:#e8e8e8;border:0;width:16px;height:14px;padding:0;font-size:10px;line-height:12px;cursor:pointer;box-shadow:inset -1px -1px #000,inset 1px 1px var(--hi);font-weight:bold}
.tb.w{width:auto;padding:0 5px;font-weight:normal}
.part{display:none}
body[data-part="tv"] #P_tv,body[data-part="library"] #P_library,body[data-part="projects"] #P_projects,body[data-part="stack"] #P_stack,body[data-part="stubs"] #P_stubs{display:flex;position:fixed;inset:0}
body.desk .part{display:flex;position:absolute}
/* ---------- TV ---------- */
#P_tv{flex-direction:column}
#P_tv.vdown{flex-direction:column-reverse}
.barwrap{flex:1;min-height:5px;position:relative;overflow:hidden;background:#232323}
.strip{position:absolute;inset:0;cursor:pointer}
.unread{position:absolute;left:24px;top:0;width:40px;height:4px;background:var(--note);display:none;animation:blink 1s steps(2) infinite}
#P_tv.vdown .unread{top:auto;bottom:0}
@keyframes blink{50%{opacity:0}}
.chatbar{position:absolute;left:18px;right:18px;top:0;height:24px;display:none;align-items:center;gap:4px;padding:2px 3px;background:var(--face);box-shadow:inset -1px -1px #000,inset 1px 1px var(--hi)}
#P_tv.vdown .chatbar{top:auto;bottom:0}
#P_tv.chat .chatbar{display:flex}
#P_tv.chat .strip{display:none}
.chatin{flex:1;min-width:0;background:#111;border:0;color:var(--text);padding:1px 5px;font:12px Tahoma,sans-serif;box-shadow:inset 1px 1px #000,inset -1px -1px #555;outline:none;height:18px;user-select:text}
.live{font-size:9.5px;color:var(--me);white-space:nowrap;display:none}
.tvrow{display:flex;height:214px;flex:none}
.side{width:18px;flex:none;background:var(--face);border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:#ddd;box-shadow:inset -1px -1px #000,inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.side:hover,.side.drop{background:#3a3a3a}
.side.on{background:#1b2333;color:#fff}
.side span.v{writing-mode:vertical-rl}
.tvbody{flex:1;display:flex;flex-direction:column;padding:3px;min-width:0}
.screen{position:relative;height:140px;background:#000;overflow:hidden;flex:none;margin-top:3px}
.screen img,.screen canvas.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
.cap{z-index:2;position:absolute;left:0;right:0;top:0;padding:3px 6px;background:rgba(0,0,0,.55);font-size:10.5px;line-height:1.3;color:#ddd;font-family:Tahoma}
.cap b{color:#fff}
.ticker{z-index:2;position:absolute;left:0;right:0;bottom:0;height:15px;background:#0a246a;color:#fff;font-size:10px;line-height:15px;white-space:nowrap;overflow:hidden}
.ticker span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
.ticker span.fit{padding-left:6px;animation:none}
@keyframes tick{to{transform:translateX(-100%)}}
.logscr{position:absolute;inset:0;padding:22px 7px 18px;font:10.5px/1.45 "Courier New",monospace;color:#9fe0b0;overflow:hidden}
.osd{z-index:3;position:absolute;right:6px;top:4px;font:bold 12px "Courier New",monospace;color:#fff;text-shadow:1px 1px #000;display:none}
.figs{height:44px;flex:none;background:#171512;position:relative;overflow:hidden}
.fig{position:absolute;bottom:0;width:30px;height:40px;transition:left .3s steps(3)}
.fig svg{display:block}
.fig .bub{position:absolute;left:18px;top:0;background:#e8e8e8;color:#000;font-size:9px;border:1px solid #000;border-radius:6px;padding:0 4px;display:none;white-space:nowrap}
.fig.typing .body{animation:shk .3s steps(4) infinite}
.fig.hop .body{animation:hop .5s steps(4)}
.fig.off{opacity:.35}
@keyframes shk{0%{transform:translateX(0)}25%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}75%{transform:translateX(-1px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}80%{transform:translateY(-3px)}}
.menu{position:absolute;z-index:30;padding:3px;display:none;min-width:190px}
.menu.show{display:block}
.menu button{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:3px 14px;cursor:pointer;font-size:12px}
.menu button:hover{background:var(--sel);color:#fff}
.menu hr{border:0;border-top:1px solid #000;border-bottom:1px solid var(--lt);margin:3px 2px}
.picker{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.picker.show{display:flex}
.picker .box{min-width:200px;padding:3px}
.picker .row{padding:2px 8px;cursor:pointer}
.picker .row:hover,.picker .row.on{background:var(--sel);color:#fff}
/* ---------- drawers ---------- */
.drawer{flex-direction:column;padding:3px;width:100%;height:100%}
.dwrap{position:absolute;top:0;bottom:0;display:flex}
.side-left .dwrap{right:0}.side-right .dwrap{left:0}
.chips{display:flex;gap:2px;flex-wrap:wrap}
.chip{border:0;padding:0 7px;cursor:pointer;font-size:11.5px;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi)}
.chip.on{background:var(--sel);color:#fff;box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi)}
.list{flex:1;min-height:0;overflow:auto;padding:2px 0}
.frow{display:flex;gap:7px;align-items:center;padding:2px 6px;cursor:default;min-height:22px}
.frow:hover{background:#1e1e1e}
.frow.sel{background:var(--sel);color:#fff}
.frow.sel .dim{color:#cfd8ff}
.frow .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th{width:34px;height:20px;flex:none;background:#1e2430;border:1px solid #000;overflow:hidden;font-size:9px;color:#7d8aa3;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover}
.cnt{font-size:10.5px;padding:0 5px;background:#333;color:#ccc;white-space:nowrap}
.cnt.zero{background:#3a2f12;color:var(--note)}
.st{font-size:10.5px;padding:0 5px;white-space:nowrap}
.st.here{background:#1d3a26;color:#9fe0b0}.st.remote{background:#0a246a;color:#fff}.st.getting{background:#3a2f12;color:var(--note)}.st.missing{background:#3a1d1d;color:#ffb4b4}.st.new{background:#1d3a26;color:#9fe0b0}
.hd{font-size:10.5px;font-weight:bold;color:#9db8ff;padding:7px 6px 2px;text-transform:uppercase;letter-spacing:.5px;display:flex;gap:6px}
.hd .r{margin-left:auto;font-weight:normal;text-transform:none;letter-spacing:0}
.plist{width:120px;flex:none;overflow:auto;padding:2px}
.prow{padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.on{background:var(--sel);color:#fff}
.prow:hover:not(.on){background:#1e1e1e}
.lnk{color:#9db8ff;cursor:pointer;text-decoration:underline}
.empty{padding:10px;color:var(--dim)}
.dropping{outline:2px dashed #9db8ff;outline-offset:-4px}
/* ---------- stack ---------- */
#P_stack{flex-direction:column;justify-content:flex-end;background:#232323}
body.vdown #P_stack{justify-content:flex-start}
.stk{display:flex;flex-direction:column-reverse;gap:2px;padding:2px}
body.vdown .stk{flex-direction:column}
.msg{background:#141414;box-shadow:inset 0 0 0 1px #444;padding:2px 7px;line-height:1.35;word-break:break-word;user-select:text}
.m0{font-size:13px}.m1{font-size:12px;opacity:.82}.m2{font-size:11.5px;opacity:.68}.m3{font-size:11px;opacity:.58}.m4{font-size:10.5px;opacity:.5}.m5{font-size:10px;opacity:.44}
.unf{transform-origin:50% 100%;animation:unf .18s steps(3) both}
body.vdown .unf{transform-origin:50% 0}
@keyframes unf{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.ghost{font-style:italic;box-shadow:inset 0 0 0 1px #3fbf6a66}
.cur{display:inline-block;width:6px;height:11px;background:#3fbf6a;vertical-align:-1px;animation:blink 1s steps(2) infinite;margin-left:1px}
.pager{display:flex;gap:4px;align-items:center;font-size:10.5px;padding:1px 2px}
.pager .btn{min-height:16px;padding:0 6px;font-size:10.5px}
/* ---------- stubs ---------- */
#P_stubs{flex-direction:column;gap:3px;align-items:flex-start;padding:0 4px 4px 0;background:#2b2b2b}
body.vdown #P_stubs{flex-direction:column-reverse;padding:4px 4px 0 0}
.stub{background:#1d1d1d;color:#e8e8e8;font-family:"Courier New",monospace;font-size:11.5px;padding:3px 22px 3px 14px;box-shadow:2px 2px 0 #000;border:1px solid #555;position:relative;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stub:before{content:"";position:absolute;left:4px;top:3px;bottom:3px;border-left:2px dotted #777}
.stub:hover{border-color:#9db8ff}
.stub .x{position:absolute;right:4px;top:2px;color:#888;font-family:Tahoma;font-size:11px}
.stub .x:hover{color:#fff}
.stub.slide{animation:slide .32s steps(5) both}
body.vdown .stub.slide{animation-name:slideup}
@keyframes slide{from{transform:translateY(-110%)}to{transform:none}}
@keyframes slideup{from{transform:translateY(110%)}to{transform:none}}
/* ---------- desk mode ---------- */
body.desk #P_tv{width:336px}
body.float{background:#2b2b2b}
body.desk #P_library,body.desk #P_projects{overflow:hidden;width:0}
body.desk #P_library .dwrap,body.desk #P_projects .dwrap{height:100%}
#tvTitle{cursor:move}#tvTitle button{cursor:pointer}
body.dragging,body.dragging *{cursor:move!important}
.toast{position:absolute;padding:4px 10px;display:none;z-index:90;font-size:12px;text-align:center}
.dlg{position:absolute;z-index:80;width:300px;padding:3px;display:none;flex-direction:column}
.dlg.show{display:flex}
.dlg .body{padding:8px;display:flex;flex-direction:column;gap:6px}
.dlg .btns{display:flex;gap:6px;justify-content:flex-end}
</style></head>
<body>
<!-- ================= TV ================= -->
<div class="part" id="P_tv">
 <div class="barwrap" id="barwrap">
  <div class="strip" id="strip" title="Chat"><span class="unread" id="unread"></span></div>
  <div class="chatbar" id="chatbar"><input class="chatin" id="say" placeholder="say something…" maxlength="2000" aria-label="Message"><span class="live" id="liveLbl">● live</span><button class="btn" id="sendBtn" style="min-height:18px;padding:0 6px">↵</button></div>
 </div>
 <div class="tvrow">
  <button class="side" id="bLib" title="Library (drop files here to file them)"><span id="aLib">◂</span><span class="v">Library</span></button>
  <div class="tvbody out" id="tvbody">
   <div class="tbar grey pywebview-drag-region" id="tvTitle"><span class="t pywebview-drag-region">RotLab TV</span><button class="tb w" id="chBtn" title="Change channel">CH1 ▾</button><button class="tb" id="menuBtn" title="Menu">☰</button><button class="tb" id="minBtn" title="Minimise">_</button><button class="tb" id="xBtn" title="Close (RotLab keeps running)">×</button></div>
   <div class="screen" id="screen"><div id="scr"></div><canvas id="noise" width="96" height="56"></canvas><div class="osd" id="osd"></div><div class="ticker" id="ticker"><span></span></div></div>
   <div class="figs" id="figs"></div>
  </div>
  <button class="side" id="bProj" title="Projects (drop files here to add them to a project)"><span id="aProj">▸</span><span class="v">Projects</span></button>
 </div>
 <div class="menu out" id="menu"></div>
 <div class="picker" id="picker"><div class="box out"><div class="tbar"><span class="t" id="pickT">Add to…</span></div><div class="in" id="pickL" style="padding:2px;max-height:150px;overflow:auto"></div></div></div>
</div>
<!-- ================= Library ================= -->
<div class="part" id="P_library"><div class="dwrap" id="libwrap" style="width:470px"><div class="drawer out" style="display:flex">
 <div class="tbar"><span class="t">Library</span><span style="font-weight:normal" id="libCount"></span></div>
 <div style="display:flex;gap:4px;padding:4px 3px 3px"><input class="field" id="libQ" placeholder="search the library…" style="flex:1;min-width:0"><button class="btn" id="libAdd" title="Add files to the library">+ Files…</button></div>
 <div class="chips" id="libCats" style="padding:0 3px 3px"></div>
 <div class="list in" id="libList"></div>
 <div style="display:flex;gap:4px;align-items:center;padding:4px 2px 1px"><span id="libSel" style="flex:1" class="dim">Click files to select them</span><button class="btn b" id="libGo" disabled>Add to project ▸</button><select class="field" id="libTo" style="max-width:120px" aria-label="Which project"></select></div>
</div></div></div>
<!-- ================= Projects ================= -->
<div class="part" id="P_projects"><div class="dwrap" id="projwrap" style="width:500px"><div class="drawer out" style="display:flex">
 <div class="tbar"><span class="t" id="projT">Projects</span><button class="tb w" id="projFull" title="Open this project in the full window">full window</button></div>
 <div style="display:flex;gap:4px;flex:1;min-height:0;padding:4px 1px 1px">
  <div style="display:flex;flex-direction:column;gap:3px"><div class="plist in" id="plist" style="flex:1"></div><button class="btn" id="pNew">+ New</button></div>
  <div class="list in" id="pview" style="flex:1;min-width:0"></div>
 </div>
</div></div></div>
<!-- ================= Message stack ================= -->
<div class="part" id="P_stack"><div id="stk"></div></div>
<!-- ================= Stubs ================= -->
<div class="part" id="P_stubs"></div>
<div class="toast out" id="toast"></div>
<div class="dlg out" id="dlg"><div class="tbar"><span class="t" id="dlgT"></span></div><div class="body" id="dlgB"></div></div>
<input type="file" id="filePick" multiple style="display:none">

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=p=>String(p||"").split("/").pop();
const ago=ts=>{const d=Date.now()/1000-ts;if(d<90)return"just now";if(d<3600)return Math.round(d/60)+" min ago";if(d<86400)return Math.round(d/3600)+" h ago";return Math.round(d/86400)+" days ago"};
const isImg=p=>/\.(jpe?g|png|gif|webp|bmp)$/i.test(p);
const LS={get(k,d){try{const v=localStorage.getItem("rl_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("rl_"+k,JSON.stringify(v))}catch(e){}}};
async function api(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";if(DESK)deskLayout();clearTimeout(e._t);e._t=setTimeout(()=>{e.style.display="none";if(DESK)deskLayout()},3500)}
/* small dialogs drawn next to the TV (native pop-ups would land in the middle of the screen) */
function dialog(title,html,buttons){return new Promise(res=>{const d=$("dlg");$("dlgT").textContent=title;
 $("dlgB").innerHTML=html+`<div class="btns">${buttons.map((b,i)=>`<button class="btn ${i===0?"b":""}" data-i="${i}">${esc(b)}</button>`).join("")}</div>`;
 const done=v=>{d.classList.remove("show");document.removeEventListener("keydown",key);if(DESK)deskLayout();res(v)};
 const key=e=>{if(e.key==="Escape")done(-1);if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA")done(0)};
 $("dlgB").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>done(+b.dataset.i));document.addEventListener("keydown",key);
 d.classList.add("show");if(DESK)deskLayout();const f=$("dlgB").querySelector("input,select");if(f)f.focus()})}
const ask=async(title,text)=>(await dialog(title,`<div>${esc(text)}</div>`,["OK","Cancel"]))===0;
const PART=new URLSearchParams(location.search).get("part")||"desk";
const DESK=PART==="desk";
document.body.dataset.part=PART;if(DESK)document.body.classList.add("desk");
let S=null,W=null;
const who=u=>S&&u===S.me?"You":u;
const pname=id=>id===(S&&S.shared)?"Library":((W&&W.projects.find(p=>p.pid===id))||{}).name||"?";
const PAL=["#3fbf6a","#e08a3a","#6aa9ff","#ff7a9a","#e8d27a","#9adbd8"];
function colorOf(u){if(S&&u===S.me)return"#b48cff";let h=0;for(const c of String(u))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]}

/* ---------- talking to Python (windows) or to the other parts (desk) ---------- */
let pyReady=null;
const py=()=>pyReady||(pyReady=new Promise(res=>{if(window.pywebview&&window.pywebview.api)return res(window.pywebview.api);window.addEventListener("pywebviewready",()=>res(window.pywebview.api));if(DESK)res(null);setTimeout(()=>res(window.pywebview?window.pywebview.api:null),4000)}));
const HANDLERS={};
function bus(part,msg){if(DESK){const parts=part==="*"?Object.keys(HANDLERS):[part];for(const p of parts)if(HANDLERS[p])setTimeout(()=>HANDLERS[p](msg),0);return}
 py().then(a=>{if(a)a.send(part,msg)})}
window.rlMsg=m=>{if(m.t==="layout")applyLayout(m);const h=HANDLERS[PART];if(h)h(m)};
let LAYOUT={vup:true,side:{library:"left",projects:"right"},chat:false};
function applyLayout(m){LAYOUT=m;document.body.classList.toggle("vdown",!m.vup);
 const tv=$("P_tv");tv.classList.toggle("vdown",!m.vup);
 for(const p of ["library","projects"]){const el=$("P_"+p);el.classList.toggle("side-left",m.side[p]==="left");el.classList.toggle("side-right",m.side[p]!=="left")}
 if(PART==="tv"||DESK){$("aLib").textContent=m.side.library==="left"?(ST.lib?"▸":"◂"):(ST.lib?"◂":"▸");$("aProj").textContent=m.side.projects==="right"?(ST.proj?"◂":"▸"):(ST.proj?"▸":"◂")}
 if(DESK)deskLayout()}
function want(w){if(DESK){Object.assign(DESKW,w);if("library" in w)animDrawer("library",w.library);if("projects" in w)animDrawer("projects",w.projects);deskLayout();return}py().then(a=>{if(a)a.want(w)})}
function openClassic(hash){if(DESK||!window.pywebview){window.open("/classic"+(hash?"#"+hash:""),"rotlab_classic");return}py().then(a=>a?a.classic(hash||""):window.open("/classic#"+(hash||"")))}

/* ---------- sounds ---------- */
let AC=null;
function snd(kind){if(!LS.get("snd",true))return;try{const A=AC||(AC=new (window.AudioContext||window.webkitAudioContext)());const t=A.currentTime;
 const noise=(len,type,freq,vol,at)=>{const b=A.createBuffer(1,Math.floor(A.sampleRate*len),A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,kind==="thunk"?3:6)*vol}const s=A.createBufferSource();s.buffer=b;const f=A.createBiquadFilter();f.type=type;f.frequency.value=freq;s.connect(f);f.connect(A.destination);s.start(t+(at||0))};
 if(kind==="open"||kind==="close"){noise(.05,"bandpass",kind==="open"?2200:1500,.35);noise(.05,"bandpass",900,.35,.2)}
 else if(kind==="thunk")noise(.12,"lowpass",380,.5);
 else if(kind==="tick")noise(.04,"bandpass",2600,.3);
 else if(kind==="stub")for(let k=0;k<3;k++)noise(.04,"highpass",2500,.3,k*.07);
 else if(kind==="static")noise(.25,"highpass",1200,.18);

let prevBusy=false;
async function makePreview(it){const src="/media?path="+encodeURIComponent(it.path);

 const fit=(w,h,mw,mh)=>{const s=Math.min(mw/w,mh/h,1);return[Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))]};
 if(it.media==="Images"||it.media==="Graphics"){const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
  const[w,h]=fit(im.naturalWidth,im.naturalHeight,480,360);cv.width=w;cv.height=h;cx.fillStyle="#222";cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);out.w=im.naturalWidth;out.h=im.naturalHeight}

  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;setTimeout(()=>rej(new Error("timeout")),20000)});
  const d=v.duration||0,[fw,fh]=fit(v.videoWidth||16,v.videoHeight||9,240,135);cv.width=fw*4;cv.height=fh;out.duration=d;out.w=v.videoWidth;out.h=v.videoHeight;
  for(let k=0;k<4;k++){v.currentTime=Math.min(d*(0.1+k*0.25),Math.max(0,d-0.1));await new Promise((res,rej)=>{v.onseeked=res;setTimeout(res,6000)});cx.drawImage(v,k*fw,0,fw,fh)}

  const ab=await ac.decodeAudioData(buf);ac.close&&ac.close();out.duration=ab.duration;const W=640,H=90,ch=ab.getChannelData(0),step=Math.max(1,Math.floor(ch.length/W));
  cv.width=W;cv.height=H;cx.fillStyle="#141a24";cx.fillRect(0,0,W,H);cx.fillStyle="#6aa9ff";
  for(let x=0;x<W;x++){let mx=0;for(let i=x*step,e=Math.min(ch.length,i+step);i<e;i+=4){const a=Math.abs(ch[i]);if(a>mx)mx=a}const bh=Math.max(1,mx*H*0.95);cx.fillRect(x,(H-bh)/2,1,bh)}}

function initStack(){let M={mode:"off",msgs:[],ghost:[]},depth=3,off=0,lastSig="",prevDepth=0;

 root.addEventListener("mouseenter",()=>bus("tv",{t:"stackover",v:true}));root.addEventListener("mouseleave",()=>bus("tv",{t:"stackover",v:false}));
 root.addEventListener("wheel",e=>{if(depth<7)return;e.preventDefault();page(e.deltaY<0?1:-1)},{passive:false});
 const page=k=>{const o=Math.max(0,Math.min(Math.max(0,M.msgs.length-6),off+k));if(o!==off){off=o;snd("tick");render(true)}};
 function render(force){let items=[];
  if(M.mode==="flash"&&M.msgs.length)items=[{m:M.msgs[M.msgs.length-1],r:0}];
  else if(M.mode==="open"){const rev=M.msgs.slice().reverse(),start=depth>=7?off:0;items=rev.slice(start,start+Math.min(depth,6)).map((m,r)=>({m,r:Math.min(5,r+(depth>=7&&off?2:0)),fresh:r>=prevDepth}))}

  h+=items.map(x=>`<div class="msg m${x.r} ${x.fresh||M.mode==="flash"?"unf":""}" ${x.r===items.length-1&&M.mode==="open"&&depth<7?'data-top="1"':""}><b style="color:${x.m.col}">${esc(x.m.who)}</b> ${esc(x.m.txt)}</div>`).join("");
  if(M.mode==="open"&&depth>=7)h+=`<div class="pager"><button class="btn" data-pg="1">▲ older</button><button class="btn" data-pg="-1">▼ newer</button><span class="dim" style="margin-left:auto">${off+1}–${Math.min(off+6,M.msgs.length)} of ${M.msgs.length}</span></div>`;
  else if(M.mode==="open"&&M.msgs.length>depth&&depth===6)h+=`<div class="pager dim" data-top="1">▲ more</div>`;
  const sig=h+depth+off;if(sig===lastSig&&!force)return;lastSig=sig;prevDepth=items.length;
  box.className="stk";box.innerHTML=h;
  box.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>page(+b.dataset.pg));
  const top=box.querySelector("[data-top]");if(top)top.addEventListener("mouseenter",()=>{if(depth<7&&M.msgs.length>depth){depth++;snd("tick");render(true)}});
  requestAnimationFrame(()=>{const hgt=items.length||M.ghost.length?Math.ceil(box.scrollHeight)+2:0;want({stack:hgt})})}

}

 for(const k of ["library","projects"]){const el=$("P_"+k),f=G.open[k],w=Math.round(DW[k]*f),sd=side[k];
  const dy=Math.max(0,Math.min(y-30,vh-DH));el.style.top=dy+"px";el.style.height=DH+"px";el.style.width=w+"px";el.style.display=w>0?"flex":"none";
  if(sd==="left"){el.style.left=(offs.left-w)+"px";offs.left-=f>0?DW[k]*f:0}else{el.style.left=offs.right+"px";offs.right+=f>0?DW[k]*f:0}
  el.classList.toggle("side-left",sd==="left");el.classList.toggle("side-right",sd!=="left")}
 /* messages above (or below) the chat bar, stubs on the other side */
 const sk=$("P_stack");sk.style.left=(x+18)+"px";sk.style.width=(TVW-36)+"px";
 if(vup){sk.style.top="auto";sk.style.bottom=(vh-tvTop)+"px"}else{sk.style.bottom="auto";sk.style.top=(tvTop+TB+bar)+"px"}
 sk.style.visibility=DESKW.stack?"visible":"hidden";
 const sb=$("P_stubs");sb.style.left=(x+24)+"px";sb.style.width=(TVW-48)+"px";
 const stubH=sb.scrollHeight;
 if(vup){sb.style.bottom="auto";sb.style.top=(y+TB)+"px"}
 else if(y>=stubH+4){sb.style.top="auto";sb.style.bottom=(vh-y)+"px"}
 else{sb.style.bottom="auto";sb.style.top=(tvTop+TB+bar+(DESKW.stack||0))+"px"}
 /* toast and dialogs sit on the TV */
 const t=$("toast");t.style.left=(x+20)+"px";t.style.width=(TVW-40)+"px";t.style.top=(tvTop+(vup?bar:0)+50)+"px";
 const d=$("dlg");d.style.left=(x+18)+"px";d.style.top=Math.max(0,Math.min(tvTop+20,vh-260))+"px";
 sendRegion()}
let regT=null,lastReg="";
function sendRegion(){if(!FLOAT)return;cancelAnimationFrame(regT);regT=requestAnimationFrame(()=>{
 const rs=[],add=el=>{if(!el)return;const r=el.getBoundingClientRect();if(r.width>0&&r.height>0)rs.push([Math.floor(r.left),Math.floor(r.top),Math.ceil(r.width)+1,Math.ceil(r.height)+1])};
 add($("P_tv"));if(G.open.library>0)add($("P_library"));if(G.open.projects>0)add($("P_projects"));
 if(DESKW.stack)add($("stk"));for(const s of $("P_stubs").children)add(s);
 if($("menu").classList.contains("show"))add($("menu"));if($("dlg").classList.contains("show"))add($("dlg"));if($("toast").style.display==="block")add($("toast"));
 const key=JSON.stringify(rs);if(key===lastReg)return;lastReg=key;py().then(a=>a&&a.region(rs,window.devicePixelRatio||1))})}
/* drag the TV by its title bar (the whole group follows); snaps to the screen edges */
function initDrag(){const t=$("tvTitle");let sx,sy,bx,by,moved=false;
 t.addEventListener("pointerdown",e=>{if(e.button!==0||e.target.closest("button"))return;t.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;bx=G.tvx;by=G.tvy;moved=false;G.dragging=true;document.body.classList.add("dragging")});
 t.addEventListener("pointermove",e=>{if(!G.dragging)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;moved=true;G.tvx=bx+dx;G.tvy=by+dy;deskLayout()});
 const end=e=>{if(!G.dragging)return;G.dragging=false;document.body.classList.remove("dragging");if(!moved)return;
  const vw=window.innerWidth,vh=window.innerHeight,bar=DESKW.chat?24:5,S=28;
  const top=G.vup?G.tvy-bar:G.tvy,bottom=top+TB+bar;
  if(Math.abs(G.tvx)<S)G.tvx=0;if(Math.abs(G.tvx+TVW-vw)<S)G.tvx=vw-TVW;
  if(Math.abs(top)<S)G.tvy+=-top;if(Math.abs(bottom-vh)<S)G.tvy-=bottom-vh;
  LS.set("tvpos",[Math.round(G.tvx),Math.round(G.tvy)]);deskLayout();snd("tick")};
 t.addEventListener("pointerup",end);t.addEventListener("pointercancel",end)}
/* ---------- start ---------- */
const inits={tv:initTV,stack:initStack,stubs:initStubs,library:initLibrary,projects:initProjects};
if(DESK){for(const k in inits)inits[k]();initDrag();window.addEventListener("resize",deskLayout);
 if(FLOAT)py().then(async a=>{const r=a?await a.ready():null;G.ready=true;if(!r||!r.ok){document.body.classList.remove("float")}setTimeout(deskLayout,120)});else deskLayout();
 new MutationObserver(()=>{if(DESK)deskLayout()}).observe($("P_stubs"),{childList:true});new MutationObserver(()=>sendRegion()).observe($("stk"),{childList:true,subtree:true})}
else if(inits[PART])inits[PART]();
const POLL={tv:2500,stubs:4000,library:5000,projects:5000,stack:0,desk:2500};
(async()=>{if(PART!=="stack"||DESK){await loadState()}if(POLL[PART])setInterval(()=>{if(PART==="library"||PART==="projects"){if(document.visibilityState==="hidden")return}loadState()},POLL[PART])})();
